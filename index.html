    V2.drag = { view, unit: u, p0: svgPt(svg, e), c0: [e.clientX, e.clientY], moved: false, delta: [0, 0, 0], id: e.pointerId };
    e.preventDefault();
  });
  svg.addEventListener('pointermove', e => {
    const D = V2.drag; if (!D || D.id !== e.pointerId) return;
    if (!D.moved && Math.hypot(e.clientX - D.c0[0], e.clientY - D.c0[1]) < 5) return;
    D.moved = true;
    const p = svgPt(svg, e), st = S.prefs.step;
    const du = Math.round((p.x - D.p0.x) / st) * st, dv = Math.round((p.y - D.p0.y) / st) * st;
    const delta = view === 'top' ? [du, -dv, 0] : [0, du, -dv];
    if (delta.join() !== D.delta.join()) { D.delta = delta; S.drag = { unit: D.unit, delta }; refresh({ panel: false }); }
  });
  const end = e => {
    const D = V2.drag;
    if (!D || D.id !== e.pointerId) {
      if (e.type === 'pointerup' && bgTap && Math.hypot(e.clientX - bgTap[0], e.clientY - bgTap[1]) < 6) selectKey(null, '2d');
      bgTap = null; return;
    }
    V2.drag = null; S.drag = null;
    if (D.moved && (D.delta[0] || D.delta[1] || D.delta[2])) commitMove(D.unit, D.delta);
    else refresh({ panel: false });
  };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);
}

/* =========================================================
   상태 · 저장 · 기록 · 되돌리기 · 실시간
   공유 저장(db): designs/<id>, history/<id>, people/<id>
   ========================================================= */
const S = {
  mode: 'loading',          // loading | shared | local
  readonly: false,
  db: null, user: null, room: null,
  meId: null,
  designs: {}, history: [], people: {}, profiles: {},
  curId: null, sel: null, drag: null, preview: null,
  tab: 'combo', ui: { orientOpen: null, renaming: null, confirmDel: null, histAll: false, cmp: [] },
  peers: [], firstSnap: false, histReady: false, bootTs: Date.now(),
  prefs: null, sync: 'loading',
};
const CUR = { robot: null, an: null };
const PREF_KEY = 'vexiq-design-prefs-v1', LOCAL_KEY = 'vexiq-design-local-v1';

function loadPrefs() {
  const def = { explain: true, view: null, sv: 'top', step: 1, startBox: false, big: false, lastDesign: null, buildDone: {} };
  try { const v = JSON.parse(localStorage.getItem(PREF_KEY) || 'null'); return Object.assign(def, v || {}); } catch (e) { return def; }
}
function savePrefs() { try { localStorage.setItem(PREF_KEY, JSON.stringify(S.prefs)); } catch (e) {} }
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- 현재 구상안 ---------- */
function liveDesigns() {
  return Object.entries(S.designs).filter(([, d]) => d && !d.deleted)
    .sort((a, b) => (a[1].createdAt || 0) - (b[1].createdAt || 0)).map(([id, d]) => Object.assign({ id }, d));
}
function curDesign() {
  const d = S.curId && S.designs[S.curId];
  return d || null;
}
function viewDesign() {
  const d = curDesign() || S.placeholder || (S.placeholder = defaultDesign('구상안 1'));
  if (!S.preview) return d;
  return deepMerge(clone(d), S.preview);
}
function ensureCur() {
  const live = liveDesigns();
  if (S.curId && S.designs[S.curId] && !S.designs[S.curId].deleted) return;
  const want = S.prefs.lastDesign && S.designs[S.prefs.lastDesign] && !S.designs[S.prefs.lastDesign].deleted ? S.prefs.lastDesign : null;
  const prev = S.curId;
  S.curId = want || (live[0] && live[0].id) || null;
  if (prev && prev !== S.curId && S.designs[prev] && S.designs[prev].deleted && S.firstSnap) toast('보던 구상안이 삭제돼서 다른 구상안을 열었어요');
}

/* ---------- 권한 ---------- */
function canEditNow(quiet) {
  if (S.mode === 'loading') { if (!quiet) toast('아직 불러오는 중이에요'); return false; }
  if (S.readonly) { if (!quiet) toast('보기 전용이라 바꿀 수 없어요'); return false; }
  if (!curDesign()) { if (!quiet) toast('먼저 구상안을 만들어 주세요'); return false; }
  return true;
}

/* ---------- 쓰기 대기열 (문서마다 한 번에 하나) ---------- */
const QUEUE = new Map();
function enqueue(path, fn) {
  const prev = QUEUE.get(path) || Promise.resolve();
  const next = prev.catch(() => {}).then(() => runWrite(fn));
  QUEUE.set(path, next);
  return next;
}
async function runWrite(fn) {
  try { return await fn(); }
  catch (e) {
    const code = e && e.code;
    if (code === 'unavailable') { await new Promise(r => setTimeout(r, 500 + Math.random() * 600)); return await fn(); }
    throw e;
  }
}
let pendingWrites = 0;
function track(p) {
  pendingWrites++; setSync('saving');
  return p.then(v => { pendingWrites--; if (!pendingWrites) setSync('saved'); return v; },
    e => { pendingWrites--; onWriteError(e); });
}
function onWriteError(e) {
  const code = e && e.code;
  if (code === 'invalid_argument' || code === 'permission-denied') {
    S.readonly = true; setSync('ro'); renderChrome(); refresh();
    toast(BACKEND.text.roToast);
  } else if (code === 'quota_exceeded' || code === 'resource-exhausted') {
    setSync('error'); toast(BACKEND.text.quota);
  } else if (code === 'revoked' || code === 'not_granted' || code === 'unauthenticated') {
    setSync('error'); toast('저장 권한이 없어졌어요. 앱을 다시 열어 주세요.');
  } else { setSync('error'); toast('저장하지 못했어요. 인터넷 연결을 확인해 주세요.'); }
}
function persistLocal() {
  if (S.mode !== 'local') return;
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ designs: S.designs, history: S.history.slice(0, 150), people: S.people })); } catch (e) {}
}

/* ---------- 바꾸기 (+기록) ----------
   h: { label } 또는 { ckey, vec, labelFn } 또는 { ckey, from, to, labelFn } */
function commit(patch, h) {
  if (!canEditNow()) return;
  const id = S.curId, d0 = S.designs[id];
  const before = clone(d0);
  const meta = { updatedAt: Date.now(), updatedBy: S.meId || null };
  S.designs[id] = Object.assign(deepMerge(clone(d0), patch), meta);
  refresh();
  if (S.mode === 'shared') track(enqueue('designs/' + id, () => S.db.doc('designs/' + id).update(Object.assign(clone(patch), meta))));
  recordHistory(id, before, h || {});
  persistLocal();
}
function recordHistory(designId, before, h) {
  const now = Date.now();
  if (h.ckey) {
    const last = S.history.find(e => e.designId === designId && !e.isUndo);
    if (last && last.ckey === h.ckey && last.by === S.meId && !last.undone && now - last.ts < 30000) {
      const upd = { ts: now };
      if (h.vec) { upd.acc = add3(last.acc || [0, 0, 0], h.vec).map(r2); upd.label = h.labelFn(upd.acc); }
      else { upd.to = h.to; upd.label = h.labelFn(last.from, h.to); }
      Object.assign(last, upd);
      if (S.mode === 'shared') track(enqueue('history/' + last.id, () => S.db.doc('history/' + last.id).update(upd)));
      persistLocal(); refreshHistoryUI();
      return;
    }
  }
  const e = { id: newId('h'), designId, ts: now, by: S.meId || null, before, ckey: h.ckey || null, kind: h.kind || 'edit',
    label: h.label || (h.vec ? h.labelFn(h.vec) : h.labelFn ? h.labelFn(h.from, h.to) : '수정'),
    acc: h.vec ? h.vec.map(r2) : null, from: h.from == null ? null : h.from, to: h.to == null ? null : h.to,
    isUndo: !!h.isUndo, undone: false };
  S.history.unshift(e);
  if (S.mode === 'shared') {
    const body = clone(e); delete body.id;
    track(enqueue('history/' + e.id, () => S.db.doc('history/' + e.id).set(body)));
  }
  persistLocal(); refreshHistoryUI();
}

/* ---------- 되돌리기 ---------- */
function undoTarget(designId) { return S.history.find(e => e.designId === designId && !e.undone && !e.isUndo && e.before); }
function undoLast() {
  if (!canEditNow()) return;
  const e = undoTarget(S.curId);
  if (!e) return toast('되돌릴 변경이 없어요');
  restoreEntry(e, false);
}
function restoreEntry(e, cascade) {
  if (S.readonly || S.mode === 'loading') return canEditNow();
  const id = e.designId, cur = clone(S.designs[id] || Object.assign(defaultDesign(), { deleted: true }));
  const target = Object.assign(clone(e.before), { updatedAt: Date.now(), updatedBy: S.meId || null });
  S.designs[id] = target;
  const affected = cascade ? S.history.filter(x => x.designId === id && x.ts >= e.ts && !x.undone && !x.isUndo) : [e];
  affected.forEach(x => { x.undone = true; });
  if (S.mode === 'shared') {
    track(enqueue('designs/' + id, () => S.db.doc('designs/' + id).set(target)));
    for (const x of affected.slice(0, 40)) track(enqueue('history/' + x.id, () => S.db.doc('history/' + x.id).update({ undone: true })));
  }
  recordHistory(id, cur, { label: (cascade ? '이 시점 전으로 돌아감 · ' : '되돌림 · ') + e.label, isUndo: true, kind: 'undo' });
  if (target.deleted && S.curId === id) { S.curId = null; ensureCur(); }
  else if (!target.deleted && !curDesign()) S.curId = id;
  persistLocal(); refresh();
  toast((cascade ? '그 변경 전으로 돌아갔어요' : '되돌렸어요') + ' · ' + e.label);
}

/* ---------- 구상안 ---------- */
function createDesign(fromId) {
  if (S.readonly || S.mode === 'loading') return canEditNow();
  const n = Object.keys(S.designs).length + 1;
  let d;
  if (fromId && S.designs[fromId]) { d = clone(S.designs[fromId]); d.name = (d.name || '구상안') + ' 복사'; }
  else d = defaultDesign('구상안 ' + n);
  Object.assign(d, { deleted: false, createdAt: Date.now(), createdBy: S.meId || null, updatedAt: Date.now(), updatedBy: S.meId || null });
  const id = newId('d');
  S.designs[id] = d; S.curId = id; S.prefs.lastDesign = id; savePrefs();
  if (S.mode === 'shared') track(enqueue('designs/' + id, () => S.db.doc('designs/' + id).set(clone(d))));
  recordHistory(id, Object.assign(clone(d), { deleted: true }), { label: fromId ? `구상안 복제 · ${d.name}` : `새 구상안 · ${d.name}`, kind: 'create' });
  persistLocal(); selectKey(null, 'silent'); refresh(); pushPresence();
  toast(`"${d.name}"을 만들었어요`);
}
/* 받은 구상안(링크)을 새 구상안으로 넣는다. src는 cleanDesign으로 거른 것 */
function importDesign(src) {
  if (S.readonly || S.mode === 'loading') return canEditNow();
  const names = new Set(liveDesigns().map(x => x.name));
  let name = src.name || '받은 구상안';
  if (names.has(name)) { let n = 2; while (names.has(`${name} (${n})`)) n++; name = `${name} (${n})`; }
  const now = Date.now();
  const d = Object.assign(clone(src), { name, deleted: false, createdAt: now, createdBy: S.meId || null, updatedAt: now, updatedBy: S.meId || null });
  const id = newId('d');
  S.designs[id] = d; S.curId = id; S.prefs.lastDesign = id; savePrefs();
  if (S.mode === 'shared') track(enqueue('designs/' + id, () => S.db.doc('designs/' + id).set(clone(d))));
  recordHistory(id, Object.assign(clone(d), { deleted: true }), { label: `받은 구상안 추가 · ${name}`, kind: 'create' });
  persistLocal(); selectKey(null, 'silent'); refresh(); pushPresence(); fitCam(true);
  toast(`"${name}"을 추가했어요`);
}
function openDesign(id) {
  if (!S.designs[id] || S.designs[id].deleted) return;
  S.curId = id; S.prefs.lastDesign = id; savePrefs(); S.preview = null;
  selectKey(null, 'silent'); refresh(); pushPresence(); fitCam(true);
}
function designPatch(id, patch, label) {
  if (S.readonly || S.mode === 'loading') return canEditNow();
  const d0 = S.designs[id]; if (!d0) return;
  const before = clone(d0), meta = { updatedAt: Date.now(), updatedBy: S.meId || null };
  S.designs[id] = Object.assign(deepMerge(clone(d0), patch), meta);
  if (S.mode === 'shared') track(enqueue('designs/' + id, () => S.db.doc('designs/' + id).update(Object.assign(clone(patch), meta))));
  recordHistory(id, before, { label, kind: 'design' });
  if (S.designs[id].deleted && S.curId === id) { S.curId = null; ensureCur(); }
  persistLocal(); refresh();
}

/* ---------- 이름 ---------- */
function personName(id) {
  const p = S.profiles[id]; if (p && p.name) return p.name;
  const q = S.people[id]; return (q && (q.nick || q.name)) || '';
}
function whoName(id) {
  if (!id) return '누군가';
  if (id === 'claude') return 'Claude';
  if (id === S.meId) return '나';
  return personName(id) || '함께 만드는 사람';
}
function myLabel() {
  const q = S.people[S.meId], p = S.meId && S.profiles[S.meId];
  return (q && (q.nick || q.name)) || (p && p.name) || '';
}
function hashColor(id) {
  let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return `hsl(${h % 360}, 62%, 48%)`;
}
function peerColor(id) { const p = S.profiles[id]; return (p && p.color) || hashColor(id); }
function avatarHtml(id) {
  const p = S.profiles[id], q = S.people[id];
  const url = (p && p.avatarUrl) || (q && q.photo);
  if (url) return `<img src="${esc(url)}" alt="" referrerpolicy="no-referrer">`;
  const nm = whoName(id), ch = id === 'claude' ? 'C' : (nm[0] || '?');
  return `<span class="av" style="background:${id === 'claude' ? '#c96442' : hashColor(id)}">${esc(ch)}</span>`;
}

/* ---------- 실시간: 같이 보는 사람 (pushPresence는 저장 연결 파일에) ---------- */
function peerSelections() {
  const out = [];
  for (const p of S.peers) {
    const pr = p.presence || {};
    if (pr.d && pr.d === S.curId && pr.sel) out.push({ key: pr.sel, color: peerColor(p.by || pr.me || p.peer) });
  }
  return out;
}

/* ---------- 공유 저장 구독 (두 저장 연결이 같이 씀) ---------- */
function subscribeShared(db) {
  const off = [];
  off.push(db.collection('designs').onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(doc => { if (doc.exists) next[doc.id] = clone(doc.data()); });
    S.designs = next; S.firstSnap = true;
    if (BACKEND.onDesigns) BACKEND.onDesigns(snap);
    ensureCur(); refresh({ keepCam: true });
    if (!S.fitted && curDesign()) { S.fitted = true; fitCam(true); }
  }, e => BACKEND.onReadError(e)));
  off.push(db.collection('history').orderBy('ts', 'desc').limit(HIST_KEEP).onSnapshot(snap => {
    if (!S.pruned && snap.size >= HIST_KEEP && !S.readonly) { S.pruned = true; pruneHistory(snap.docs[snap.docs.length - 1].data().ts); }
    if (S.histReady) {
      for (const ch of snap.docChanges()) {
        if (ch.type === 'removed') continue;
        const e = ch.doc.data();
        if (e && e.by !== S.meId && e.ts > S.bootTs - 2000) foreignToast(ch.doc.id, e);
      }
    }
    S.history = snap.docs.map(doc => Object.assign({ id: doc.id }, doc.data()));
    S.histReady = true;
    resolveNames(S.history.map(e => e.by));
    refreshHistoryUI();
  }, () => {}));
  off.push(db.collection('people').onSnapshot(snap => {
    const m = {}; snap.docs.forEach(doc => { m[doc.id] = doc.data(); }); S.people = m; refreshHistoryUI(); renderPeers();
  }, () => {}));
  return () => off.forEach(f => { try { f && f(); } catch (e) {} });
}
const HIST_KEEP = 300;
function pruneHistory(oldestKept) {
  S.db.collection('history').orderBy('ts', 'asc').limit(80).get().then(q => {
    for (const doc of q.docs) {
      const e = doc.data();
      if (e && e.ts < oldestKept) track(enqueue('history/' + doc.id, () => S.db.doc('history/' + doc.id).delete()));
    }
  }).catch(() => {});
}
const lastToast = new Map();
function foreignToast(id, e) {
  const t = lastToast.get(id) || 0;
  if (Date.now() - t < 5000) return;
  lastToast.set(id, Date.now());
  const d = S.designs[e.designId];
  const where = e.designId !== S.curId && d ? ` (${d.name})` : '';
  toast(`<b>${esc(whoName(e.by))}</b> · ${esc(e.label)}${esc(where)}`, true);
}
const SEEDED_KEY = 'vexiq-design-seeded-v1';
function startLocal() {
  S.mode = 'local'; S.meId = 'local';
  try {
    const v = JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null');
    if (v && v.designs) { S.designs = v.designs; S.history = v.history || []; S.people = v.people || {}; }
  } catch (e) {}
  // Claude 앱에서 만든 구상안·기록을 이 기기에 처음 한 번 넣는다 (이미 있는 건 그대로)
  let seeded = false;
  try { seeded = !!localStorage.getItem(SEEDED_KEY); } catch (e) {}
  const seed = window.SEED;
  if (!seeded && seed && seed.designs) {
    for (const [id, d] of Object.entries(seed.designs)) if (!S.designs[id]) S.designs[id] = clone(d);
    const have = new Set(S.history.map(e => e.id));
    S.history = S.history.concat((seed.history || []).filter(e => e && e.id && !have.has(e.id)).map(clone)).sort((a, b) => (b.ts || 0) - (a.ts || 0));
    S.people = Object.assign({}, seed.people || {}, S.people);
    try { localStorage.setItem(SEEDED_KEY, String(Date.now())); } catch (e) {}
    persistLocal();
  }
  if (!liveDesigns().length) {
    const d = defaultDesign('구상안 1'); const id = newId('d');
    S.designs[id] = d;
  }
  // 브라우저가 저장 공간을 함부로 비우지 않게 부탁해 둔다
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
  S.firstSnap = true; S.histReady = true;
  ensureCur(); setSync('local'); renderChrome(); refresh(); fitCam(true);
}

/* =========================================================
   저장 연결: Firebase (설치형 앱)
   구글 로그인 → Firestore: designs · history · people · presence · meta
   등록된 계정만 읽고 쓸 수 있게 Firestore 보안 규칙으로 막는다.
   ========================================================= */
const BACKEND = {
  kind: 'firebase',
  text: {
    // Firebase 없이 기기마다 따로 쓰는 게 기본이라 안내 띠를 띄우지 않는다
    local: '',
    syncLocal: '이 기기에 저장됨',
    ro: '이 구글 계정은 등록되지 않아서 저장할 수 없어요.',
    roToast: '이 구글 계정은 등록되지 않아서 저장할 수 없어요.',
    quota: '오늘 쓸 수 있는 무료 저장 횟수를 다 썼어요. 내일 다시 저장돼요.',
  },
  onReadError(e) {
    if (e && e.code === 'permission-denied') return notMember();
    setSync('error'); toast('불러오지 못했어요. 인터넷 연결을 확인해 주세요.');
  },
  onDesigns(snap) { maybeImportSeed(snap); },
  saveNick(id, v) { return S.db.doc('people/' + id).update({ nick: v, ts: Date.now() }); },
  accountHtml() {
    if (!FBS.user) return '';
    return `<section class="sec"><div class="nick"><span>로그인한 계정: <b>${esc(FBS.user.email || '')}</b></span><button class="btn sm" type="button" data-act="logout">로그아웃</button></div></section>`;
  },
  login() { login(); },
  logout() { if (FBS.auth) FBS.auth.signOut(); },
};
const FBS = { auth: null, fs: null, user: null, off: null, presOff: null, pres: [], peerSig: '', hb: null, imported: false };

/* Claude 쪽 db와 같은 모양으로 감싼다. update는 하위 객체까지 합치는 set(merge)로.
   Firestore는 undefined 값을 받지 않아서 JSON으로 한 번 걸러서 보낸다. */
const fbClean = d => JSON.parse(JSON.stringify(d));
function fbAdapter(fs) {
  const wrap = r => ({
    id: r.id, path: r.path,
    get: () => r.get(),
    set: d => r.set(fbClean(d)),
    update: d => r.set(fbClean(d), { merge: true }),
    delete: () => r.delete(),
    onSnapshot: (n, e) => r.onSnapshot(n, e),
  });
  return { doc: p => wrap(fs.doc(p)), collection: p => fs.collection(p) };
}

function initBackend() {
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey || !window.firebase) return startLocal();
  try {
    firebase.initializeApp(cfg);
    FBS.auth = firebase.auth();
    FBS.fs = firebase.firestore();
    const p = FBS.fs.enablePersistence && FBS.fs.enablePersistence({ synchronizeTabs: true });
    if (p && p.catch) p.catch(() => {});
  } catch (e) { console.error(e); return startLocal(); }
  bindGate();
  FBS.auth.getRedirectResult().catch(e => { if (!FBS.user) authError(e); });
  FBS.auth.onAuthStateChanged(u => (u ? signedIn(u) : signedOut()));
}

/* ---------- 로그인 화면 ---------- */
function bindGate() {
  if (!els.gate || els.gate.dataset.bound) return;
  els.gate.dataset.bound = '1';

let presTimer = null;
function pushPresence() {
  if (!FBS.fs || !S.meId || S.mode !== 'shared' || S.readonly) return;
  clearTimeout(presTimer);
  presTimer = setTimeout(() => {
    if (!S.db || !S.meId) return;
    S.db.doc('presence/' + S.meId).update({ d: S.curId || null, sel: (S.sel && S.sel.key) || null, ts: Date.now(), on: document.visibilityState === 'visible' }).catch(() => {});
  }, 500);
}
function startPresence() {
  if (FBS.presOff) FBS.presOff();
  FBS.presOff = FBS.fs.collection('presence').onSnapshot(snap => {
    FBS.pres = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    updatePeers();
  }, () => {});
  pushPresence();
  if (!FBS.hb) {
    FBS.hb = setInterval(() => { if (document.visibilityState === 'visible') pushPresence(); updatePeers(); }, 30000);
    document.addEventListener('visibilitychange', pushPresence);
    window.addEventListener('pagehide', () => {
      if (S.db && S.meId) S.db.doc('presence/' + S.meId).update({ on: false, ts: Date.now() }).catch(() => {});
    });

}
function updatePeers() {
  const now = Date.now();
  const list = (FBS.pres || []).filter(p => p.id !== S.meId && p.on && now - (p.ts || 0) < 75000)
    .map(p => ({ peer: p.id, by: p.id, isMe: false, kind: 'viewer', presence: { d: p.d || null, sel: p.sel || null, me: p.id } }));
  const sig = JSON.stringify(list.map(p => [p.by, p.presence.d, p.presence.sel]));

/* ---------- Claude 앱에서 만든 구상안·기록 처음 한 번 가져오기 ----------
   저장소가 비어 있고 아직 가져온 적이 없을 때만. 기기 캐시가 아니라 서버에 물어보고 정한다. */
function maybeImportSeed(snap) {
  if (FBS.imported || !window.SEED || !snap.empty || S.readonly) return;
  FBS.imported = true;
  const server = { source: 'server' };
  FBS.fs.doc('meta/import').get(server).then(m => {
    if (m.exists) return;
    return FBS.fs.collection('designs').limit(1).get(server).then(q => {
      if (!q.empty) return;
      const ops = [];
      for (const [id, d] of Object.entries(SEED.designs || {})) ops.push(['designs/' + id, d]);
      for (const e of SEED.history || []) { const body = Object.assign({}, e); delete body.id; ops.push(['history/' + e.id, body]); }
      for (const [id, p] of Object.entries(SEED.people || {})) ops.push(['people/' + id, p, true]);
      const chunks = [];
      for (let i = 0; i < ops.length; i += 400) chunks.push(ops.slice(i, i + 400));
      return chunks.reduce((pr, ch) => pr.then(() => {
        const b = FBS.fs.batch();
        for (const [path, data, merge] of ch) b.set(FBS.fs.doc(path), fbClean(data), merge ? { merge: true } : {});
        return b.commit();
      }), Promise.resolve())
        .then(() => FBS.fs.doc('meta/import').set({ at: Date.now(), by: S.meId, from: 'claude-artifact' }))
        .then(() => toast('Claude 앱에서 만든 구상안과 기록을 가져왔어요'));
    });
  }).catch(e => {
    FBS.imported = false;   // 인터넷이 다시 되면 다음에 다시 시도
    if (e && e.code === 'permission-denied') notMember();
  });
}

function setOpt(k, v) {

  if (old === v) return;

  }
  const title = k === 'dir' && d.opts.launch === 'lift' ? '넣는 방향' : OPTS[k].title;
  commit(patch, { label: `${title}: ${optName(k, old)} → ${optName(k, v)}${note}`, kind: 'opt' });
  if (note) toast(`레일 각도를 ${patch.opts.rail}°로 맞췄어요`);

function setOrient(k, v) {

  const n = curDesign().orient;
  if (n.top && n.front && !(o.top && o.front)) { S.ui.orientOpen = false; renderPanel(); toast('앞·위를 정했어요. 부품 이름이 "앞 왼쪽"처럼 바뀌었어요'); }
}
function commitMove(u, vec) {

  if (u.type === 'mod') {
    const m = (d.mods && d.mods[u.mod]) || {};
    patch = { mods: { [u.mod]: { dx: r2((m.dx || 0) + vec[0]), dy: r2((m.dy || 0) + vec[1]), dz: r2((m.dz || 0) + vec[2]) } } };

    const e = (d.edits && d.edits[u.key]) || {}, pv = T.inv(vec[0], vec[1], vec[2]);
    patch = { edits: { [u.key]: Object.assign({}, e, { dx: r2((e.dx || 0) + pv[0]), dy: r2((e.dy || 0) + pv[1]), dz: r2((e.dz || 0) + pv[2]), hidden: false }) } };
  } else {
    const a = d.added[u.cid]; if (!a) return;
    patch = { added: { [u.cid]: Object.assign({}, a, { c: [r2(a.c[0] + vec[0]), r2(a.c[1] + vec[1]), r2(a.c[2] + vec[2])] }) } };
  }
  commit(patch, { ckey: 'mv:' + u.id, vec, labelFn: acc => `${name} 이동 · ${vecWords(acc)}` });
}
function moveSel(vec) { commitMove(selUnit(), vec); }
function resetPos() {
  const u = selUnit(); if (!u || !canEditNow()) return;
  const d = curDesign(), name = unitName(u, CUR.robot);
  if (u.type === 'mod') commit({ mods: { [u.mod]: { dx: 0, dy: 0, dz: 0 } } }, { label: `${name} 원래 자리로` });
  else if (u.type === 'drive') commit({ edits: { [u.key]: Object.assign({}, d.edits[u.key] || {}, { dx: 0, dy: 0, dz: 0 }) } }, { label: `${name} 원래 자리로` });
}
function resizeSel(ax, sg) {
  const u = selUnit(); if (!u || !canEditNow()) return;
  const d = curDesign(), R = CUR.robot, p = R.byKey.get(S.sel.key), st = S.prefs.step;
  if (!p) return;
  const axName = p.shape === 'cyl' ? ['두께', '지름'][ax] : ['가로', '세로', '높이'][ax];
  const cur = p.shape === 'cyl' ? (ax === 0 ? p.len : p.r * 2) : p.s[ax];
  const nv = r2(cur + sg * st);
  if (nv < 0.5) return toast('더 줄일 수 없어요');
  const name = unitName(u, R), lf = (f, t) => `${name} ${axName} ${fmtN(f)} → ${fmtN(t)}칸`;
  if (u.type === 'drive') {
    const e = d.edits[u.key] || {}, f = ['dw', 'dl', 'dh'][ax];
    commit({ edits: { [u.key]: Object.assign({}, e, { [f]: r2((e[f] || 0) + sg * st) }) } }, { ckey: 'sz:' + u.id + ax, from: cur, to: nv, labelFn: lf });
  } else if (u.type === 'custom') {
    const a = d.added[u.cid], s = a.s.slice();

    commit({ added: { [u.cid]: Object.assign({}, a, { s }) } }, { ckey: 'sz:' + u.id + ax, from: cur, to: nv, labelFn: lf });

}
function addPart(kind) {

  const d = curDesign(), n = Object.values(d.added || {}).filter(a => a && a.kind === kind).length + 1;
  const id = newId('p'), name = `${def.label} ${n}`;
  const z = r2(CUR.an.bb.max[2] + def.s[2] / 2 + 1);

  if (e.key === 'Enter' && e.target.id === 'nickIn') { e.preventDefault(); saveNick(); }
  if (e.key === 'Enter' && e.target.id === 'pasteIn') { e.preventDefault(); pasteImport(); }
}

/* ---------- 나란히 비교 ---------- */
function miniTop(R) {
  const bb = allBB(R), m = 1.5;
  const vb = [bb.min[0] - m, -(bb.max[1] + m), bb.max[0] - bb.min[0] + 2 * m, bb.max[1] - bb.min[1] + 2 * m];
  const parts = R.parts.slice().sort((a, b) => a.bb.max[2] - b.bb.max[2]).filter(p => p.shape !== 'line' && !p.ghost)
    .map(p => `<rect class="pt ${visCls(p)}" x="${f2(p.bb.min[0])}" y="${f2(-p.bb.max[1])}" width="${f2(p.bb.max[0] - p.bb.min[0])}" height="${f2(p.bb.max[1] - p.bb.min[1])}"/>`).join('');
  return `<svg class="d2" viewBox="${vb.map(f2).join(' ')}" style="width:100%;height:100%;background:var(--paper)">${parts}</svg>`;
}
function openCompare() {
  const ids = S.ui.cmp.filter(id => S.designs[id] && !S.designs[id].deleted);
  if (ids.length < 2) return toast('비교할 구상안을 2개 이상 체크하세요');
  const cols = ids.map(id => { const d = S.designs[id], R = buildRobot(d), A = analyze(R); return { id, d: normDesign(d), R, A }; });
  const rows = [
    ['발사 방식', c => optName('launch', c.d.opts.launch)],
    ['발사 방향', c => optName('dir', c.d.opts.dir)],
    ['인테이커', c => optName('intake', c.d.opts.intake)],
    ['브레인', c => optName('brain', c.d.opts.brain)],
    ['고무줄', c => c.d.opts.launch && c.d.opts.launch !== 'lift' ? c.d.opts.bands + '개' : '-'],
    ['각도', c => c.d.opts.launch && c.d.opts.launch !== 'lift' ? c.d.opts.rail + '°' : '-'],
    ['당기는 장치', c => SLING(c.d.opts.launch) ? optName('pull', c.d.opts.pull) : '-'],
    ['앞·위', c => c.d.orient.top && c.d.orient.front ? `${c.d.orient.top}면 위 · 끝 ${c.d.orient.front === 'end1' ? 1 : 2} 앞` : '미정'],
    ['프레임', c => `${c.d.frame.w}×${c.d.frame.l}칸`],
    ['크기 (폭×길이×높이)', c => `${inch(c.A.short)} × ${inch(c.A.long)} × ${inch(c.A.dims.h)}in`, true],
    ['무게(추정)', c => (c.A.M / 1000).toFixed(2) + 'kg', true],
    ['무게중심 쏠림', c => c.A.ratio ? `좌우 ${Math.round(Math.abs(c.A.ratio.x) * 100)}% · 앞뒤 ${Math.round(Math.abs(c.A.ratio.y) * 100)}%` : '-', true],
    ['경고', c => (c.A.nDanger + c.A.nWarn) ? c.A.warnings.filter(w => w.level !== 'info').map(w => w.title).join(' / ') : '없음'],
  ];
  let h = `<div class="cmp"><div class="cmp-cols">${cols.map(c => `<div class="cmp-col"><h4>${esc(c.d.name)}</h4><div class="img" data-img="${c.id}">${miniTop(c.R)}</div></div>`).join('')}</div>
    <div class="cmp-tab"><table><tbody>${rows.map(([k, f, mono]) => {
      const vals = cols.map(f), diff = new Set(vals).size > 1;
      return `<tr class="${diff ? 'diff' : ''}"><th>${k}</th>${vals.map(v => `<td class="${mono ? 'mono' : ''}">${esc(v)}</td>`).join('')}</tr>`;
    }).join('')}</tbody></table></div>

  els.sheetBody.innerHTML = h;
  els.sheet.hidden = false;
  els.sheetClose.focus();
  requestAnimationFrame(() => {
    for (const c of cols) {
      const url = snapshot3D(c.R, c.A);
      const box = els.sheetBody.querySelector(`[data-img="${c.id}"]`);
      if (url && box) box.innerHTML = `<img src="${url}" alt="${esc(c.d.name)} 3D 모습">`;
    }

}
function closeCompare() { els.sheet.hidden = true; els.sheetBody.innerHTML = ''; }

/* ---------- 알림 ---------- */
function toast(msg, html) {
  const t = document.createElement('div'); t.className = 'toast';
  if (html) t.innerHTML = msg; else t.textContent = msg;
  els.toasts.appendChild(t);
  while (els.toasts.children.length > 3) els.toasts.firstChild.remove();
  setTimeout(() => t.remove(), 3400);
}

/* =========================================================
   만드는 법: 고른 옵션대로 조립 순서 · 부품 · 요령 · 규칙
   - 칸 수는 앱 모델 크기로 어림한 값 (1칸 = 구멍 간격 12.7mm)
   - 부품 이름은 VEX IQ (2nd gen) 키트 이름 + 영어 이름(부품 포스터용)
   - 규칙은 VIQRC 2026-27 Level Up 매뉴얼 R 규칙 기준
   ========================================================= */
const HERO = {
  i3d: 'https://link.vex.com/docs/26-27/viqrc/hero-robot-instructions',
  pdf: 'https://link.vex.com/docs/26-27/viqrc/hero-robot-instructions-pdf',
  parts: 'https://docs.google.com/spreadsheets/d/134rXfE9KyW5ffhzk2MDPSEsMF4Amvvg5eddhcFC66zA/edit?usp=sharing',
  lab: 'https://education.vex.com/stemlabs/iq/competition-101-vex-iq-level-up',
};
const BEAM1 = [2, 4, 5, 6, 8, 10, 12, 16];
function beamName(n) {
  const k = Math.max(2, Math.round(n));
  const b = BEAM1.find(x => x >= k);
  return b ? `1x${b} 빔` : `2x${k <= 18 ? 18 : 20} 빔`;
}
const beamEn = n => beamName(n).replace(' 빔', ' Beam');
const pt = (n, q, en) => ({ n, q, en: en || '' });
const MOTOR_KINDS = ['motor', 'launchMotor', 'liftMotor', 'intakeMotor', 'cMotor'];
const RULE_BAND = '고무줄은 VEX IQ 실리콘 고무줄이나, 길이 7.5인치·폭 0.25인치 이하 고무줄만 쓸 수 있어요(R14).';
const RULE_MOD = '부품을 자르거나 깎거나 붙이면 안 돼요. 금속 축 자르기, 고무줄·로프 매듭은 괜찮아요(R17).';

function guideMotors(R) {
  const m = R.parts.filter(p => MOTOR_KINDS.includes(p.kind));
  return { all: m, drive: m.filter(p => p.kind === 'motor').length, intake: m.some(p => p.kind === 'intakeMotor'),
    launch: m.some(p => p.kind === 'launchMotor' || p.kind === 'liftMotor'), custom: m.filter(p => p.kind === 'cMotor').length };
}

/* ---------- 상태 ---------- */
function guideState() {
  const d = curDesign();
  if (!d || !CUR.robot) return null;
  const G = buildGuide(d, CUR.robot), flat = G.flatMap(g => g.steps);
  const done = ((S.prefs.buildDone || {})[S.curId]) || {};
  return { G, flat, done, open: flat.find(s => s.id === S.ui.buildOpen) || null };
}
/* refresh 때 불러서, 펼친 단계의 부품을 2D·3D에서 강조한다 */

  if (S.tab !== 'build' || !S.ui.buildOpen || !CUR.robot) { S.buildFocus = null; return; }
  const st = guideState();
  S.buildFocus = st && st.open && st.open.keys.length ? st.open.keys : null;
}
function openBuildStep(id, scroll) {
  S.ui.buildOpen = S.ui.buildOpen === id ? null : id;
  applyBuildFocus();
  render2D(); update3D(); renderPanel();
  if (S.buildFocus) focusCam(S.buildFocus); else viewAll();
  if (scroll && S.ui.buildOpen) {
    const el = document.querySelector(`.bstep[data-id="${CSS.escape(S.ui.buildOpen)}"]`);
    if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' });

}
function stepBuild(dir) {
  const st = guideState(); if (!st) return;
  const i = st.flat.findIndex(s => s.id === S.ui.buildOpen);
  const n = st.flat[Math.max(0, Math.min(st.flat.length - 1, i + dir))];
  if (n && n.id !== S.ui.buildOpen) { S.ui.buildOpen = null; openBuildStep(n.id, true); }
}
function setBuildDone(id, v) {
  const all = S.prefs.buildDone || (S.prefs.buildDone = {});
  const m = all[S.curId] || (all[S.curId] = {});
  if (v) m[id] = Date.now(); else delete m[id];
  savePrefs(); renderPanel();
}
function viewAll() {
  if (typeof fitCam !== 'function' || !V3.ok) return;
  const f = fitCam(false);
  if (f) animCam({ th: V3.cam.th, ph: V3.cam.ph, r: f.r, tgt: f.tgt });
}

/* ---------- 화면 ---------- */
const mdLite = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
function partsSummary(flat) {
  const m = new Map();
  for (const s of flat) for (const p of s.parts || []) {
    const k = p.n, cur = m.get(k);
    if (!cur) m.set(k, Object.assign({}, p));
    else cur.q = typeof cur.q === 'number' && typeof p.q === 'number' ? cur.q + p.q : '여러 개';
  }
  return [...m.values()];
}
function htmlBuild() {
  const st = guideState();
  if (!st) return '<div class="empty">구상안을 먼저 만들어 주세요.</div>';
  const { G, flat, done, open } = st;
  const real = flat.filter(s => !s.pick), nDone = real.filter(s => done[s.id]).length;
  const pct = real.length ? Math.round(nDone / real.length * 100) : 0;
  const d = curDesign();
  let h = `<section class="sec"><div class="sec-h"><h3>만드는 법</h3><span class="aside">${nDone}/${real.length} 단계</span></div>
    <p class="hint">${esc(designSummary(d))}</p>
    <div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <p class="hint ex-only">고른 옵션대로 만드는 순서예요. 단계를 누르면 3D와 도면에서 그 부분이 초록색으로 보여요. 칸 수와 개수는 이 구상안 크기로 어림한 값이라, 실제 부품을 대 보며 맞춰요.</p></section>`;
  h += `<section class="sec hero"><div class="sec-h"><h3>처음이라면: 공식 로봇 Flop</h3></div>
    <p class="hint">VEX가 이번 시즌(Level Up)용으로 낸 로봇이에요. 인테이커로 빈백을 잡고 팔로 들어 올려요. 3D 설명서를 따라 한 번 만들어 보면 부품이 어떻게 이어지는지 익힐 수 있어요.</p>
    <div class="btnrow"><a class="btn sm" href="${HERO.i3d}" target="_blank" rel="noopener">3D 설명서</a><a class="btn sm" href="${HERO.pdf}" target="_blank" rel="noopener">PDF 설명서</a><a class="btn sm" href="${HERO.parts}" target="_blank" rel="noopener">부품 목록</a><a class="btn sm" href="${HERO.lab}" target="_blank" rel="noopener">첫 로봇 수업</a></div></section>`;
  const sum = partsSummary(real);
  if (sum.length) h += `<section class="sec"><details class="plist"><summary><b>준비물</b> · 부품 ${sum.length}가지 (어림)</summary><ul>${sum.map(p =>
    `<li><span class="q">${esc(p.q)}</span><span>${esc(p.n)}${p.en ? ` <small>${esc(p.en)}</small>` : ''}</span></li>`).join('')}</ul></details></section>`;
  let no = 0;
  for (const g of G) {
    h += `<section class="sec"><div class="sec-h"><h3>${esc(g.title)}</h3></div><div class="blist">`;
    for (const s of g.steps) {
      const isOpen = open && open.id === s.id, isDone = !!done[s.id];
      if (!s.pick) no++;
      h += `<div class="bstep${isOpen ? ' open' : ''}${isDone ? ' done' : ''}${s.pick ? ' pick' : ''}" data-id="${esc(s.id)}">
        <button class="bs-h" type="button" data-act="buildStep" data-id="${esc(s.id)}" aria-expanded="${!!isOpen}">
          <span class="no">${s.pick ? '?' : isDone ? '✓' : no}</span><span class="tt">${esc(s.title)}</span>${s.keys.length ? '<span class="eye" aria-hidden="true">보기</span>' : ''}</button>`;
      if (isOpen) {
        h += '<div class="bs-b">';
        if (s.parts.length) h += `<div class="chips">${s.parts.map(p => `<span class="pchip" title="${esc(p.en)}"><b>${esc(p.q)}</b> ${esc(p.n)}</span>`).join('')}</div>`;
        h += `<ol class="how">${s.how.map(x => `<li>${mdLite(x)}</li>`).join('')}</ol>`;
        if (s.warn) h += `<p class="bnote w"><b>주의</b> ${mdLite(s.warn)}</p>`;
        if (s.rule) h += `<p class="bnote r"><b>규칙</b> ${mdLite(s.rule)}</p>`;
        if (s.tip) h += `<p class="bnote t"><b>요령</b> ${mdLite(s.tip)}</p>`;
        h += '<div class="bs-f">';
        if (s.pick) h += '<button class="btn sm pri" type="button" data-act="go" data-tab="combo">조합 탭으로</button>';
        else h += `<label class="donebox"><input type="checkbox" data-act="buildDone" data-id="${esc(s.id)}" ${isDone ? 'checked' : ''}> 다 했어요</label>`;
        h += `<span class="grow"></span><button class="btn sm" type="button" data-act="buildPrev">이전</button><button class="btn sm pri" type="button" data-act="buildNext">다음</button></div></div>`;
      }
      h += '</div>';
    }
    h += '</div></section>';
  }
  h += `<section class="sec"><p class="hint">규칙은 VEX IQ 대회 2026-27 Level Up 매뉴얼의 R 규칙 기준이에요. 매뉴얼이 바뀔 수 있으니 대회 전에 한 번 더 확인하세요.</p>
    ${open ? '<button class="btn sm" type="button" data-act="buildAll">단계 닫고 전체 보기</button>' : ''}</section>`;
  return h;
}

/* =========================================================
   구상안 보내기 · 받기 (링크로, 계정·서버 없이)
   링크 모양: <앱 주소>?d=<압축한 구상안>
   ========================================================= */
const SHARE_KEY = 'd';
const b64u = {
  enc(bytes) { let s = ''; for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  dec(str) { const s = atob(str.replace(/-/g, '+').replace(/_/g, '/')); const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; },
};
async function zipBytes(bytes, pack) {
  const st = new Blob([bytes]).stream().pipeThrough(pack ? new CompressionStream('deflate-raw') : new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
/* 받은 자료는 믿지 않는다: 아는 칸만, 정해진 범위 안의 값만 남긴다 */
function cleanDesign(src) {
  const num = (v, lo, hi, def) => (v != null && v !== '' && Number.isFinite(+v) ? clamp(+v, lo, hi) : def);
  const str = (v, n) => String(v == null ? '' : v).replace(/[<>]/g, '').trim().slice(0, n);
  const pick = (v, list) => (list.includes(v) ? v : null);
  const ch = k => OPTS[k].choices.map(c => c.v);
  const s = src && typeof src === 'object' ? src : {}, o = s.opts || {}, f = s.frame || {}, r = s.orient || {};
  const d = {
    name: str(s.name, 40) || '받은 구상안',
    frame: { w: Math.round(num(f.w, 14, 24, 16)), l: Math.round(num(f.l, 19, 32, 20)) },
    orient: { top: pick(r.top, ['A', 'B']), front: pick(r.front, ['end1', 'end2']) },
    opts: {
      launch: pick(o.launch, ch('launch')), dir: pick(o.dir, ch('dir')) || 'front', intake: pick(o.intake, ch('intake')),
      brain: pick(o.brain, ch('brain')), bands: Math.round(num(o.bands, 1, 8, 4)), rail: Math.round(num(o.rail, 15, 85, 40)),
      pull: pick(o.pull, ch('pull')) || 'winch',
    },
    mods: {}, edits: {}, added: {}, notes: str(s.notes, 2000),
  };
  for (const [k, m] of Object.entries(s.mods || {})) {
    if (MODS[k] && m && typeof m === 'object') d.mods[k] = { dx: num(m.dx, -60, 60, 0), dy: num(m.dy, -60, 60, 0), dz: num(m.dz, -60, 60, 0) };
  }
  for (const [k, e] of Object.entries(s.edits || {})) {
    if (!/^[\w:.-]{1,40}$/.test(k) || !e || typeof e !== 'object') continue;
    const x = {};
    for (const q of ['dx', 'dy', 'dz', 'dw', 'dl', 'dh']) if (e[q] != null) x[q] = num(e[q], -60, 60, 0);
    if (e.hidden != null) x.hidden = !!e.hidden;
    d.edits[k] = x;
  }
  const kinds = ADDABLE.map(a => a.kind);
  for (const [k, a] of Object.entries(s.added || {})) {
    if (!/^[\w-]{1,40}$/.test(k) || !a || !kinds.includes(a.kind) || !Array.isArray(a.c) || !Array.isArray(a.s)) continue;
    d.added[k] = {
      kind: a.kind, name: str(a.name, 40) || ADDABLE.find(x => x.kind === a.kind).label,
      c: [0, 1, 2].map(i => num(a.c[i], -80, 80, 0)), s: [0, 1, 2].map(i => num(a.s[i], 0.5, 80, 1)),
    };
  }
  return d;
}
async function packDesign(d) {
  const raw = new TextEncoder().encode(JSON.stringify({ v: 1, d: cleanDesign(d) }));
  if (window.CompressionStream) return 'z' + b64u.enc(await zipBytes(raw, true));
  return 'j' + b64u.enc(raw);
}
async function unpackDesign(code) {
  code = String(code || '').trim();
  let raw = b64u.dec(code.slice(1));
  if (code[0] === 'z') raw = await zipBytes(raw, false);
  else if (code[0] !== 'j') throw new Error('bad code');
  const o = JSON.parse(new TextDecoder().decode(raw));
  if (!o || o.v !== 1 || !o.d || typeof o.d !== 'object') throw new Error('bad data');
  return cleanDesign(o.d);
}
function shareCodeOf(text) {
  text = String(text || '').trim();
  if (/^[zj][\w-]{8,}$/.test(text)) return text;
  try {
    const u = new URL(text, location.href);
    const h = u.hash.startsWith('#' + SHARE_KEY + '=') ? u.hash.slice(SHARE_KEY.length + 2) : null;
    return u.searchParams.get(SHARE_KEY) || h;
  } catch (e) { return null; }
}
const inKakao = () => /KAKAOTALK/i.test(navigator.userAgent);
const coarsePointer = () => !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);

/* ---------- 보내기 ---------- */
async function shareDesign(id) {
  const d = S.designs[id]; if (!d) return;
  let url;
  try { url = location.origin + location.pathname + '?' + SHARE_KEY + '=' + await packDesign(d); }
  catch (e) { return toast('링크를 만들지 못했어요'); }
  const title = `VEX 구상안 · ${d.name}`;
  S.ui.shareUrl = null;
  if (navigator.share && coarsePointer()) {
    try { await navigator.share({ title, text: title, url }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(url); toast('링크를 복사했어요. 카톡에 붙여 넣어 보내세요'); }
  catch (e) { S.ui.shareUrl = url; renderPanel(); }
}

/* ---------- 받기: 링크로 열었을 때 ---------- */
async function checkIncoming() {
  const href = location.href, code = shareCodeOf(href);
  if (!code) return;
  history.replaceState(null, '', location.pathname);
  // 카톡 안 브라우저는 저장 공간이 앱과 따로라서 바깥 브라우저(설치한 앱)로 넘긴다
  if (inKakao()) { S.incomingUrl = href; openExternal(); }
  try { S.incoming = await unpackDesign(code); }
  catch (e) { S.incoming = null; toast('받은 링크가 망가졌어요. 다시 보내 달라고 해 주세요'); }
  renderChrome();
}
function openExternal() {
  if (S.incomingUrl) location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(S.incomingUrl);
}
function acceptIncoming() {
  const d = S.incoming; S.incoming = null; S.incomingUrl = null;
  if (d) importDesign(d); else renderChrome();
}
function dismissIncoming() { S.incoming = null; S.incomingUrl = null; renderChrome(); }
async function pasteImport() {
  const i = document.getElementById('pasteIn'); if (!i) return;
  const code = shareCodeOf(i.value);
  if (!code) return toast('구상안 링크가 아니에요. 받은 링크를 통째로 붙여 넣어 주세요');
  try { const d = await unpackDesign(code); i.value = ''; importDesign(d); }
  catch (e) { toast('링크가 망가졌어요. 다시 보내 달라고 해 주세요'); }
}
window.addEventListener('hashchange', () => { if (S.mode !== 'loading') checkIncoming(); });

/* =========================================================
   설치형 앱: 오프라인 캐시 등록 · 새 버전 알림 · "앱 설치" 버튼
   ========================================================= */
(function () {
  const secure = location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname);
  if ('serviceWorker' in navigator && secure) {
    const sw = navigator.serviceWorker;
    let ctl = sw.controller;
    // 새 버전이 설치돼 화면을 넘겨받으면 알려 준다 (처음 설치할 때는 빼고)
    sw.addEventListener('controllerchange', () => {
      const had = ctl; ctl = sw.controller;
      if (!had || typeof S !== 'object') return;
      S.updateReady = true;
      if (typeof renderChrome === 'function' && els && els.app) renderChrome();
    });
    window.addEventListener('load', () => {
      sw.register('./sw.js').then(reg => {
        // 앱을 오래 켜 둬도 다시 볼 때 새 버전이 있는지 확인 (10분에 한 번까지)
        let last = Date.now();
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState !== 'visible' || Date.now() - last < 600000) return;
          last = Date.now(); reg.update().catch(() => {});
        });
      }).catch(() => {});
    });
  }
  let deferred = null;
  const btn = () => document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferred = e;
    const b = btn(); if (b) b.hidden = false;
  });
  window.addEventListener('appinstalled', () => {
    deferred = null; const b = btn(); if (b) b.hidden = true;
    if (typeof toast === 'function') toast('앱을 설치했어요. 이제 아이콘으로 열 수 있어요');
  });
  document.addEventListener('click', e => {
    if (!e.target.closest || !e.target.closest('#installBtn') || !deferred) return;
    deferred.prompt();
    deferred.userChoice.finally(() => { deferred = null; const b = btn(); if (b) b.hidden = true; });
  });
})();

/* =========================================================
   시작 · 이벤트 연결
   ========================================================= */
let BOOTED = false;
function boot(hotData) {
  if (BOOTED) return; BOOTED = true;
  cacheEls();
  S.prefs = loadPrefs();
  hotData = hotData || {};
  if (hotData.tab) S.tab = hotData.tab;
  if (hotData.curId) S.prefs.lastDesign = hotData.curId;
  setSync('loading');
  init3D();
  bindUI();
  refresh();
  if (hotData.cam) Object.assign(V3.cam, hotData.cam); else fitCam(true);
  try {
    const hot = window.claude && window.claude.hot;
    if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ curId: S.curId, tab: S.tab, cam: Object.assign({}, V3.cam, { tgt: V3.cam.tgt.slice() }) }));
  } catch (e) {}
  initBackend();
  if (typeof checkIncoming === 'function') checkIncoming();
}
function bindUI() {
  els.pbody.addEventListener('click', onPanelClick);
  els.pbody.addEventListener('input', onPanelInput);
  els.pbody.addEventListener('change', onPanelChange);
  els.pbody.addEventListener('keydown', onPanelKey);
  els.pbody.addEventListener('focusout', () => setTimeout(() => { if (panelDirty) renderPanelSafe(); }, 0));
  els.pick.addEventListener('click', onPanelClick);
  els.banner.addEventListener('click', onPanelClick);
  els.ptabs.addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab, false); });
  els.explainToggle.addEventListener('change', () => { S.prefs.explain = els.explainToggle.checked; savePrefs(); renderChrome(); render2D(); request3D(); });
  els.designPick.addEventListener('click', () => setTab('designs', true));
  els.viewSeg.addEventListener('click', e => {
    const b = e.target.closest('[data-view]'); if (!b) return;
    S.prefs.view = b.dataset.view; savePrefs(); renderChrome();
    requestAnimationFrame(() => { resize3D(); render2D(); });
  });
  els.sideSeg.addEventListener('click', e => {
    const b = e.target.closest('[data-sv]'); if (!b) return;
    S.prefs.sv = b.dataset.sv; savePrefs(); renderChrome(); requestAnimationFrame(render2D);
  });
  els.startBoxBtn.addEventListener('click', () => { S.prefs.startBox = !S.prefs.startBox; savePrefs(); refresh({ panel: false }); });
  els.bigBtn.addEventListener('click', () => { S.prefs.big = !S.prefs.big; savePrefs(); renderChrome(); requestAnimationFrame(() => { resize3D(); render2D(); }); });
  bind2D(els.svgTop, 'top');
  bind2D(els.svgSide, 'side');
  els.sheetClose.addEventListener('click', closeCompare);
  els.sheet.addEventListener('click', e => {
    if (e.target === els.sheet) return closeCompare();
    const b = e.target.closest('[data-act="openFromCmp"]');
    if (b) { closeCompare(); openDesign(b.dataset.id); toast(`"${S.designs[b.dataset.id].name}"을 열었어요`); }
  });
  document.addEventListener('keydown', onKey);
  let lastW = window.innerWidth;
  window.addEventListener('resize', () => {
    const w = window.innerWidth, cross = [760, 1100].some(bp => (lastW < bp) !== (w < bp));
    lastW = w;
    if (cross) renderChrome();
    requestAnimationFrame(() => { resize3D(); render2D(); });
  });
  const mq = window.matchMedia && matchMedia('(prefers-color-scheme: dark)');
  if (mq && mq.addEventListener) mq.addEventListener('change', () => { applyTheme3D(); refresh({ panel: false }); });
  new MutationObserver(() => { applyTheme3D(); refresh({ panel: false }); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  setInterval(() => { if (S.tab === 'hist' || S.tab === 'designs') renderPanelSafe(); }, 60000);
}
function onKey(e) {
  const t = e.target, tag = (t && t.tagName || '').toLowerCase();
  if (!els.sheet.hidden) { if (e.key === 'Escape') closeCompare(); return; }
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || (t && t.isContentEditable)) return;
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undoLast(); return; }
  if (e.key === 'Escape') { selectKey(null, 'view'); return; }
  if (!S.sel) return;
  const st = S.prefs.step; let v = null;
  if (e.key === 'ArrowUp') v = e.shiftKey ? [0, 0, st] : [0, st, 0];
  else if (e.key === 'ArrowDown') v = e.shiftKey ? [0, 0, -st] : [0, -st, 0];
  else if (e.key === 'ArrowLeft') v = [-st, 0, 0];
  else if (e.key === 'ArrowRight') v = [st, 0, 0];
  else if (e.key === 'PageUp') v = [0, 0, st];
  else if (e.key === 'PageDown') v = [0, 0, -st];
  if (v) { e.preventDefault(); moveSel(v); }
}
(function start() {
  const go = () => {
    const hot = window.claude && window.claude.hot;
    try {
      if (hot && typeof hot.ready === 'function') { hot.ready(boot); setTimeout(() => boot((hot && hot.data) || {}), 1500); return; }
    } catch (e) {}
    boot((hot && hot.data) || {});
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
})();
