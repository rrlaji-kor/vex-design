<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VEX IQ 로봇 설계</title>
<meta name="description" content="VEX IQ Level Up 로봇 구도를 옵션으로 조합하고 2D 도면·3D로 확인하며 같이 고치는 앱">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#192028" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VEX 설계">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
:root{
  /* Layout: drafting table — 2D drawing beside the 3D model, configurator rail on the right; on phones the model pins to the top and the rail scrolls under it */
  --bg:#e7ebef; --paper:#f8fafc; --surface:#ffffff; --surface-2:#f0f3f6;
  --ink:#16202b; --muted:#556070; --faint:#8590a0;
  --line:#d3dae2; --line-strong:#b2bcc7;
  --accent:#1b6dd0; --accent-soft:#e0ecfb; --accent-ink:#ffffff;
  --c-launch:#dc6420; --c-intake:#1c8c60; --c-brain:#6d50e2; --c-custom:#4c6990;
  --ok:#1b8253; --warn:#b06900; --danger:#c93232; --info:#3567ab;
  --ok-soft:#ddf2e7; --warn-soft:#fbeed6; --danger-soft:#fbe3e3; --info-soft:#e2ebf8;
  --p-beam:#c3c8ce; --p-edge:#7f8892; --p-conn:#fdfdfe; --p-motor:#d3d7dc; --p-cap:#686e76;
  --p-wheel:#2a2e33; --p-shaft:#7a818a; --p-band:#bf8526; --p-bag:#e6b51a;
  --grid:#e4e9ee; --grid-major:#cbd3dc;
  --scene-bg:#e3e8ed; --scene-grid:#cbd3dc; --scene-grid-major:#a9b4c0;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 6px 18px rgba(20,30,45,.08);
  --f-sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --r-sm:7px;
  --vh-view:clamp(270px,46vh,470px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1318; --paper:#141a21; --surface:#192028; --surface-2:#202933;
  --ink:#e2e8ee; --muted:#99a4b0; --faint:#6b7785;
  --line:#27303a; --line-strong:#3a4552;
  --accent:#5aa1ff; --accent-soft:#15304f; --accent-ink:#06101c;
  --c-launch:#ff8c4b; --c-intake:#3cc18b; --c-brain:#9c88ff; --c-custom:#88a4c9;
  --ok:#3bcd8c; --warn:#f0a53f; --danger:#ff6a6a; --info:#6fa8ff;
  --ok-soft:#11331f; --warn-soft:#382811; --danger-soft:#3b1717; --info-soft:#142944;
  --p-beam:#a4abb4; --p-edge:#d1d6dc; --p-conn:#e8ecf0; --p-motor:#b4bac2; --p-cap:#4b525a;
  --p-wheel:#090b0d; --p-shaft:#9ba2aa; --p-band:#e0a54a; --p-bag:#f2c632;
  --grid:#1b232c; --grid-major:#2a3440;
  --scene-bg:#11171d; --scene-grid:#222b35; --scene-grid-major:#34404d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1318; --paper:#141a21; --surface:#192028; --surface-2:#202933;
  --ink:#e2e8ee; --muted:#99a4b0; --faint:#6b7785;
  --line:#27303a; --line-strong:#3a4552;
  --accent:#5aa1ff; --accent-soft:#15304f; --accent-ink:#06101c;
  --c-launch:#ff8c4b; --c-intake:#3cc18b; --c-brain:#9c88ff; --c-custom:#88a4c9;
  --ok:#3bcd8c; --warn:#f0a53f; --danger:#ff6a6a; --info:#6fa8ff;
  --ok-soft:#11331f; --warn-soft:#382811; --danger-soft:#3b1717; --info-soft:#142944;
  --p-beam:#a4abb4; --p-edge:#d1d6dc; --p-conn:#e8ecf0; --p-motor:#b4bac2; --p-cap:#4b525a;
  --p-wheel:#090b0d; --p-shaft:#9ba2aa; --p-band:#e0a54a; --p-bag:#f2c632;
  --grid:#1b232c; --grid-major:#2a3440;
  --scene-bg:#11171d; --scene-grid:#222b35; --scene-grid-major:#34404d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.3);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:break-word}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:flex;flex-direction:column;min-height:100%}

/* ---------- header ---------- */
.hd{background:var(--surface);border-bottom:1px solid var(--line);padding-inline:16px;position:relative;z-index:8}
.hd-row{display:flex;align-items:center;gap:10px;min-height:50px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-mark{width:26px;height:26px;flex:none}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
.sync[data-s="saved"] i{background:var(--ok)}
.sync[data-s="saving"] i{background:var(--warn)}
.sync[data-s="error"] i,.sync[data-s="ro"] i{background:var(--danger)}
.sync[data-s="local"] i{background:var(--info)}
.peers{display:flex;align-items:center}
.peer{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:2px 8px 2px 2px;border:1px solid var(--line);border-radius:99px;background:var(--surface-2);margin-left:4px;max-width:150px}
.peer img,.peer .av{width:20px;height:20px;border-radius:50%;flex:none}
.peer .av{display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.peer .pn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switch{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;font-size:13px;font-weight:600}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .sw{width:34px;height:20px;border-radius:99px;background:var(--line-strong);position:relative;transition:background .15s;flex:none}
.switch .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+.sw{background:var(--accent)}
.switch input:checked+.sw::after{transform:translateX(14px)}
.switch input:focus-visible+.sw{outline:2px solid var(--accent);outline-offset:2px}
.apptabs{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
.apptabs::-webkit-scrollbar{display:none}
.apptab{border:0;background:none;padding:6px 10px 9px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.apptab.on{color:var(--ink);border-bottom-color:var(--ink)}
.apptab:disabled{color:var(--faint);cursor:default}
.apptab small{font-size:10.5px;font-weight:600;letter-spacing:.02em;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px;color:var(--faint)}
.design-pick{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;max-width:46vw;margin-bottom:5px}
.design-pick span{overflow:hidden;text-overflow:ellipsis}
.banner{padding:8px 16px;font-size:13px;background:var(--info-soft);color:var(--ink);border-bottom:1px solid var(--line)}
.banner[data-k="ro"]{background:var(--warn-soft)}

/* ---------- work area ---------- */
.work{flex:1;display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
.views{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;height:var(--vh-view);background:var(--bg);border-bottom:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0}
.app.big .views{--vh-view:74vh}
.vbar{display:flex;align-items:center;gap:8px;padding:8px 12px 6px;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.vbar::-webkit-scrollbar{display:none}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px;flex:none}
.seg button{border:0;background:none;padding:4px 10px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tool{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 9px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:5px}
.tool.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.vbar .grow{flex:1}
.stage{position:relative;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);min-height:0;padding:0 12px 12px;gap:10px}
.pane2d,.pane3d{position:relative;min-height:0;min-width:0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.pane2d{background:var(--paper);display:grid;grid-template-rows:minmax(0,1fr);gap:0}
.pane3d{background:var(--scene-bg)}
.views[data-v="3d"] .pane2d{display:none}
.views[data-v="2d"] .pane3d{display:none}
.sv{position:relative;min-height:0;overflow:hidden}
.sv+.sv{border-top:1px solid var(--line)}
.sv-cap{position:absolute;top:8px;left:10px;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.01em;pointer-events:none;background:var(--paper);padding:0 4px;border-radius:4px}
.sv svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.pane2d[data-only="top"] .sv[data-sv="side"],.pane2d[data-only="side"] .sv[data-sv="top"]{display:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--surface);color:var(--ink);border:1px solid var(--line);white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lbl[data-m="launcher"]{color:var(--c-launch);border-color:var(--c-launch)}
.lbl[data-m="intake"]{color:var(--c-intake);border-color:var(--c-intake)}
.lbl[data-m="brain"]{color:var(--c-brain);border-color:var(--c-brain)}
.lbl.front{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.lbl.com{font-weight:600;font-size:11px}
.cam{position:absolute;top:8px;right:8px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:70%}
.cam button{border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:11.5px;font-weight:600;padding:3px 7px;color:var(--muted)}
.nogl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);font-size:13px}
.pick{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:start;max-width:520px}
.pick h4{margin:0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pick p{margin:0;font-size:12.5px;color:var(--muted);grid-column:1/-1;max-width:62ch}
.pick .acts{display:flex;gap:6px;align-items:center}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.02em;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--surface-2);white-space:nowrap}
.chip.g-drive{color:var(--ink)}
.chip.g-launcher{color:var(--c-launch);border-color:color-mix(in srgb,var(--c-launch) 45%,transparent)}
.chip.g-intake{color:var(--c-intake);border-color:color-mix(in srgb,var(--c-intake) 45%,transparent)}
.chip.g-brain{color:var(--c-brain);border-color:color-mix(in srgb,var(--c-brain) 45%,transparent)}
.chip.g-custom{color:var(--c-custom)}
.chip.ghost{border-style:dashed}
.lv{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;white-space:nowrap}
.lv-danger{background:var(--danger-soft);color:var(--danger)}
.lv-warn{background:var(--warn-soft);color:var(--warn)}
.lv-info{background:var(--info-soft);color:var(--info)}
.lv-ok{background:var(--ok-soft);color:var(--ok)}

/* ---------- panel ---------- */
.panel{background:var(--surface);min-width:0}
.ptabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--vh-view));z-index:5;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--surface);border-bottom:1px solid var(--line)}
.app.big .ptabs{top:calc(env(safe-area-inset-top,0px) + 74vh)}
.ptab{border:0;background:none;padding:11px 2px 9px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.ptab.on{color:var(--accent);border-bottom-color:var(--accent)}
.ptab .n{font-family:var(--f-mono);font-size:10.5px;font-weight:600;min-width:17px;height:17px;border-radius:99px;display:inline-grid;place-items:center;padding:0 4px;background:var(--danger);color:#fff}
.ptab .n.w{background:var(--warn)}
.pbody{padding:6px 16px 40px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.sec{padding-block:14px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:0 0 10px}
.sec-h h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sec-h .num{font-family:var(--f-mono);font-size:11.5px;font-weight:600;color:var(--faint)}
.sec-h .aside{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 10px;max-width:64ch}
.hint b{color:var(--ink);font-weight:600}
.ex-only{}
.app.noex .ex-only{display:none!important}

/* option cards — 설명 켜짐: 한 줄 한 카드(아이콘 | 이름·설명·장단점), 꺼짐: 아이콘 타일 격자 */
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.card{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;display:grid;grid-template-columns:28px minmax(0,1fr);gap:3px 12px;align-items:start;min-width:0;transition:border-color .12s,background .12s}
.card:hover{border-color:var(--line-strong)}
.card.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.card svg.ic{width:28px;height:28px;color:var(--ink);grid-row:1/4;margin-top:1px}
.card.on svg.ic{color:var(--accent)}
.card .nm{font-weight:700;font-size:14px;line-height:1.35;min-width:0;grid-column:2}
.card .ds{font-size:12.5px;color:var(--muted);line-height:1.45;grid-column:2}
.card .pc{grid-column:2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:3px;font-size:11.5px;line-height:1.45}
.card .pc .col{display:grid;gap:2px;align-content:start}
.card .pc .li{display:grid;grid-template-columns:11px minmax(0,1fr);gap:3px}
.card .pc .li::before{font-family:var(--f-mono);font-weight:700}
.card .pc .li.p::before{content:"+";color:var(--ok)}
.card .pc .li.m::before{content:"−";color:var(--danger)}
.app.noex .cards{grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:6px}
.app.noex .card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:9px 6px}
.app.noex .card .nm{font-size:12px;line-height:1.3}
.app.noex .card svg.ic{width:24px;height:24px}
#sec-orient .card{grid-template-columns:28px minmax(0,1fr)}
.app.noex #sec-orient .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
.undec{margin-top:8px;border:1px dashed var(--line-strong);background:none;border-radius:99px;font-size:12px;font-weight:600;color:var(--muted);padding:3px 10px}
.undec.on{border-style:solid;border-color:var(--ink);color:var(--ink)}
.slider{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;margin-top:12px}
.slider label{font-weight:600;font-size:13px}
.slider output{font-family:var(--f-mono);font-weight:600;font-size:13px}
.slider input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent);height:28px}
.slider .ds{grid-column:1/-1;font-size:12px;color:var(--muted)}
.slider.off{opacity:.45}
.minirow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.minirow .lab{font-weight:600;font-size:13px;margin-right:4px}

/* orientation step */
.orient{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.oc{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px;text-align:left;display:grid;gap:6px;min-width:0}
.oc.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.oc .ph{position:relative;border-radius:6px;overflow:hidden;background:var(--surface-2);aspect-ratio:240/280;max-width:100%}
.oc .ph img{width:100%;height:100%;object-fit:cover;display:block}
.oc .ph .end{position:absolute;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:700;background:rgba(10,14,20,.78);color:#fff;padding:1px 6px;border-radius:4px;white-space:nowrap}
.oc .ph .end.t{top:4px}
.oc .ph .end.b{bottom:4px}
.oc .nm{font-weight:700;font-size:13.5px}
.oc .ds{font-size:12px;color:var(--muted);line-height:1.45}
.oq{font-weight:600;font-size:13px;margin:12px 0 8px}
.oq:first-of-type{margin-top:0}
.stat{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}

/* parts tab */
.selbox{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface-2);display:grid;gap:10px}
.selbox h4{margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-wrap:balance}
.selbox .role{font-size:12.5px;color:var(--muted);margin:0}
.selbox .txt{font-size:13px;margin:0;max-width:64ch}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.mover{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:4px}
.pad button,.zbtn button,.step button,.sz button{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;font-size:12px;font-weight:700;color:var(--ink);display:grid;place-items:center;line-height:1.1;padding:0}
.pad button:active,.zbtn button:active,.sz button:active{background:var(--accent-soft)}
.pad .c{border-style:dashed;color:var(--muted);font-size:10.5px;font-weight:600}
.zcol{display:grid;gap:8px;justify-items:start}
.zbtn{display:flex;gap:4px}
.zbtn button{width:64px;height:40px}
.step{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.step button{height:28px;padding:0 9px;font-size:12px}
.step button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.sz{display:grid;grid-template-columns:auto 34px 60px 34px;gap:6px 6px;align-items:center;font-size:12.5px}
.sz button{height:30px;font-size:16px}
.sz output{text-align:center;font-family:var(--f-mono);font-size:12.5px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dng{color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45}
.plist{display:grid;gap:4px}
.pgrp{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pgrp summary{list-style:none;cursor:pointer;padding:9px 12px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px;background:var(--surface-2)}
.pgrp summary::-webkit-details-marker{display:none}
.pgrp summary .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--faint);font-weight:600}
.pitem{display:flex;align-items:center;gap:8px;width:100%;border:0;border-top:1px solid var(--line);background:var(--surface);padding:7px 12px;text-align:left;font-size:13px}
.pitem:hover{background:var(--surface-2)}
.pitem.on{background:var(--accent-soft)}
.pitem .dot{width:10px;height:10px;border-radius:3px;flex:none;border:1px solid var(--p-edge)}
.pitem .m{margin-left:auto;font-size:11px;color:var(--warn);font-weight:700}
.pitem.hid{color:var(--faint);text-decoration:line-through}
.addgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.addgrid .btn{justify-content:center}
.frame{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.frame .sz{grid-template-columns:auto 34px 46px 34px}

/* warnings */
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.met{border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;min-width:0}
.met .k{font-size:11.5px;color:var(--muted);font-weight:600}
.met .v{font-family:var(--f-mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.met .v small{font-size:11px;color:var(--faint);font-weight:500;font-family:var(--f-sans)}
.met .bar{height:4px;border-radius:2px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.met .bar i{display:block;height:100%;background:var(--ok)}
.met.bad .bar i{background:var(--danger)}
.met.bad .v{color:var(--danger)}
.wlist{display:grid;gap:8px}
.w{border:1px solid var(--line);border-left-width:4px;border-radius:var(--r);padding:10px 12px;display:grid;gap:4px;background:var(--surface)}
.w.danger{border-left-color:var(--danger)}
.w.warn{border-left-color:var(--warn)}
.w.info{border-left-color:var(--info)}
.w h5{margin:0;font-size:13.5px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.w p{margin:0;font-size:12.5px;color:var(--muted);max-width:66ch}
.w .btnrow{margin-top:4px}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r);padding:16px;text-align:center;color:var(--muted);font-size:13px}
.rules{font-size:12.5px;color:var(--muted);display:grid;gap:3px;margin:0;padding-left:18px}
.rules b{color:var(--ink);font-weight:600}
.src{font-size:11.5px;color:var(--faint);margin-top:8px}
.src a{color:inherit}

/* designs */
.dlist{display:grid;gap:8px}
.drow{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--surface)}
.drow.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.drow input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.drow .nm{font-weight:700;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .meta{grid-column:2/-1;font-size:12px;color:var(--muted)}
.drow .acts{grid-column:2/-1;display:flex;gap:6px;flex-wrap:wrap}
.rename{display:flex;gap:6px;grid-column:2/-1}
.rename input{flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:8px;padding:5px 9px;background:var(--surface)}
.confirm{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--danger-soft);border-radius:8px;padding:8px 10px;font-size:12.5px}

/* history */
.hlist{display:grid;gap:0}
.hrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.hrow:last-child{border-bottom:0}
.hrow img{width:26px;height:26px;border-radius:50%}
.hrow .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.hrow .t{font-size:13.5px;line-height:1.4}
.hrow .t b{font-weight:700}
.hrow .m{font-size:11.5px;color:var(--faint);grid-column:2}
.hrow.undone .t{color:var(--faint);text-decoration:line-through}
.hrow .btn{grid-row:1/3;grid-column:3}
.nick{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.nick input{border:1px solid var(--line-strong);border-radius:8px;padding:4px 8px;width:130px;background:var(--surface)}
.paste{display:flex;gap:6px;align-items:center}
.paste input,.linkbox{flex:1;min-width:0;width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:7px 9px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px}
.banner .btn{margin-left:4px}

/* compare sheet */
.sheet{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:stretch;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.sheet-in{background:var(--surface);display:flex;flex-direction:column;min-height:0;max-height:100%;overflow:hidden}
@media (min-width:760px){.sheet{place-items:center;padding:24px}.sheet-in{width:min(1100px,100%);max-height:92vh;border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow)}}
.sheet-hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet-hd h3{margin:0;font-size:16px}
.sheet-bd{overflow:auto;padding:12px 16px 24px}
.cmp{display:grid;gap:10px;min-width:0}
.cmp-cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:10px}
.cmp-col{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.cmp-col .img{background:var(--scene-bg);aspect-ratio:4/3;display:grid;place-items:center;max-width:100%}
.cmp-col .img img{width:100%;height:100%;object-fit:cover;display:block}
.cmp-col h4{margin:0;padding:8px 10px;font-size:14px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp-tab{overflow-x:auto}
.cmp-tab table{border-collapse:collapse;width:100%;font-size:12.5px}
.cmp-tab th,.cmp-tab td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp-tab th{color:var(--muted);font-weight:600;white-space:nowrap;width:1%}
.cmp-tab tr.diff td{background:var(--accent-soft)}
.cmp-tab td.mono{font-variant-numeric:tabular-nums}

/* toasts */
.toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:grid;gap:6px;justify-items:center;pointer-events:none;width:min(92vw,440px)}
.toast{background:var(--ink);color:var(--surface);font-size:13px;padding:8px 14px;border-radius:9px;box-shadow:var(--shadow);max-width:100%;animation:tin .18s ease-out}
.toast b{font-weight:700}
@keyframes tin{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.switch .sw,.switch .sw::after{transition:none}}

/* ---------- 2D drawing ---------- */
.pane2d[data-only=""]{grid-template-rows:minmax(0,1.25fr) minmax(0,1fr)}
.d2 .gminor{stroke:var(--grid);stroke-width:.05;fill:none}
.d2 .gmajor{stroke:var(--grid-major);stroke-width:.08;fill:none}
.d2 .com .q{fill:var(--ink)}
.d2 .mtxt,.d2 .com,.d2 .gtxt,.d2 .ftxt,.d2 .arrow,.d2 .sup,.d2 .lim,.d2 .floor{pointer-events:none}
.d2 .xr{fill-opacity:.82}
.d2 .pt{vector-effect:non-scaling-stroke;stroke-width:1;cursor:pointer}
.d2 .k-wall,.d2 .k-beam,.d2 .k-plate{fill:var(--p-beam);stroke:var(--p-edge)}
.d2 .k-conn{fill:var(--p-conn);stroke:var(--p-edge)}
.d2 .k-motor{fill:var(--p-motor);stroke:var(--p-edge)}
.d2 .k-wheel{fill:var(--p-wheel);stroke:var(--p-edge)}
.d2 .k-shaft,.d2 .k-collar{fill:var(--p-shaft);stroke:var(--p-edge)}
.d2 .k-band{stroke:var(--p-band);fill:none;stroke-width:1.4}
.d2 .k-bag{fill:var(--p-bag);stroke:var(--p-edge);opacity:.85}
.d2 .k-string{stroke:var(--ink);fill:none;stroke-dasharray:2 2}
.d2 .m-launcher{fill:color-mix(in srgb,var(--c-launch) 26%,transparent);stroke:var(--c-launch);stroke-dasharray:4 2}
.d2 .m-intake{fill:color-mix(in srgb,var(--c-intake) 26%,transparent);stroke:var(--c-intake);stroke-dasharray:4 2}
.d2 .m-brain{fill:color-mix(in srgb,var(--c-brain) 26%,transparent);stroke:var(--c-brain);stroke-dasharray:4 2}
.d2 .m-custom{fill:color-mix(in srgb,var(--c-custom) 30%,transparent);stroke:var(--c-custom)}
.d2 .ph-box{stroke-dasharray:6 3;stroke-width:1.4}
.d2 .ghost{fill:none;stroke-dasharray:2 3;opacity:.7;pointer-events:none}
.d2 .pt.sel{stroke:var(--accent);stroke-width:2.6;stroke-dasharray:none}
.d2 .pt.bad{stroke:var(--danger);stroke-width:2.2;stroke-dasharray:none}
.d2 .pt.peer{stroke-width:2.4;stroke-dasharray:3 2}
.d2 .pt.focus{stroke:var(--ok);stroke-width:2.8;stroke-dasharray:none}
.d2 .pt.dim{opacity:.3}
.d2 .floor{stroke:var(--ink);stroke-width:1.4;vector-effect:non-scaling-stroke}
.d2 .lim{stroke:var(--danger);stroke-width:1;stroke-dasharray:6 4;fill:none;vector-effect:non-scaling-stroke;opacity:.8}
.d2 .sup{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3;fill:none;vector-effect:non-scaling-stroke;opacity:.5}
.d2 .com circle{fill:var(--surface);stroke:var(--ink);stroke-width:1.4;vector-effect:non-scaling-stroke}
.d2 .com path{stroke:var(--ink);stroke-width:1.4;vector-effect:non-scaling-stroke}
.d2 .gtxt{fill:var(--muted);font-family:var(--f-sans);font-weight:600}
.d2 .ftxt{fill:var(--ink);font-family:var(--f-sans);font-weight:700}
.d2 .mtxt{font-family:var(--f-sans);font-weight:700;paint-order:stroke;stroke:var(--paper);stroke-width:.32;stroke-linejoin:round}
.d2 .mtxt.launcher{fill:var(--c-launch)}
.d2 .mtxt.intake{fill:var(--c-intake)}
.d2 .mtxt.brain{fill:var(--c-brain)}
.d2 .arrow{fill:var(--ink)}

/* ---------- wider screens ---------- */
@media (min-width:760px){
  body{overflow:hidden}
  .app{height:100%}
  .work{grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:minmax(0,1fr);min-height:0;overflow:hidden}
  .views{position:relative;top:auto;height:auto;min-height:0;overflow:hidden;border-bottom:0;border-right:1px solid var(--line)}
  .app.big .views{--vh-view:auto}
  .panel{overflow-y:auto;overscroll-behavior:contain}
  .ptabs{top:0}
  .app.big .ptabs{top:0}
  .bigbtn{display:none!important}
  .pick{left:16px;right:auto;width:min(440px,calc(100% - 32px))}
}
@media (min-width:1100px){
  .work{grid-template-columns:minmax(0,1fr) 390px}
  .views[data-v="split"] .stage{grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr)}
  .views[data-v="split"] .pane2d{grid-template-rows:minmax(0,1.25fr) minmax(0,1fr)}
  .views[data-v="split"] .pick{left:auto;right:24px}
}
@media (max-width:1099.98px){
  .views[data-v="split"] .pane2d{display:none}
}
@media (max-width:420px){
  .brand-name{font-size:14px}
  .sync span{display:none}
  .cards{gap:6px}
  .card{padding:9px}
}

/* 만드는 법 */
.prog{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:8px 0 6px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:inherit;transition:width .25s}
.sec.hero{background:var(--ok-soft);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:12px}
.sec.hero .sec-h{margin-bottom:6px}
.sec.hero .btnrow{margin-top:8px}
a.btn{text-decoration:none}
.plist summary{cursor:pointer;font-size:13.5px;padding:2px 0}
.plist ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:5px}
.plist li{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:8px;font-size:13px;align-items:baseline}
.plist .q{font-family:var(--f-mono);font-weight:600;text-align:right;font-size:12px}
.plist small{color:var(--faint);font-size:11.5px}
.blist{display:grid;gap:8px}
.bstep{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);scroll-margin-top:calc(var(--vh-view) + 52px)}
.bstep.open{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.bstep.pick{border-style:dashed}
.bs-h{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:10px 12px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;border-radius:var(--r)}
.bs-h .no{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);font-family:var(--f-mono)}
.bstep.open .bs-h .no{box-shadow:0 0 0 2px var(--ok);color:var(--ink)}
.bstep.done .bs-h .no{background:var(--ok);color:#fff;box-shadow:none}
.bs-h .tt{flex:1;min-width:0;font-weight:600;font-size:14px}
.bstep.done .bs-h .tt{color:var(--muted)}
.bs-h .eye{flex:none;font-size:11.5px;font-weight:600;color:var(--ok)}
.bs-b{padding:0 12px 12px 46px;display:grid;gap:9px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{font-size:12px;border:1px solid var(--line-strong);border-radius:99px;padding:2px 9px;background:var(--surface-2);white-space:nowrap}
.pchip b{font-family:var(--f-mono);font-weight:600}
.how{margin:0;padding-left:18px;display:grid;gap:6px;font-size:13.5px;line-height:1.55}
.bnote{margin:0;font-size:12.5px;line-height:1.5;padding:7px 9px;border-radius:8px}
.bnote b{margin-right:5px}
.bnote.r{background:var(--info-soft)}
.bnote.t{background:var(--surface-2)}
.bnote.w{background:var(--warn-soft)}
.bs-f{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bs-f .grow{flex:1}
.donebox{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;cursor:pointer}
.donebox input{width:18px;height:18px;accent-color:var(--ok)}
@media (max-width:420px){.bs-b{padding-left:12px}.ptab{font-size:12.5px}}

/* 설치형 앱: 로그인 화면 */
.gate{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding:24px 16px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.gate-card{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:28px 22px 22px;display:grid;gap:12px;justify-items:center;text-align:center}
.gate-mark{width:52px;height:52px}
.gate-card h2{margin:4px 0 0;font-size:20px;letter-spacing:-.02em}
.gate-card p{margin:0;color:var(--muted);font-size:14px;max-width:32ch;text-wrap:balance}
.gate-btn{width:100%;justify-content:center;padding:11px 14px;font-size:15px}
.gate-note{font-size:12.5px!important;color:var(--faint)!important}
</style>
</head>
<body>
<div id="app" class="app">
  <header class="hd">
    <div class="hd-row">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="5" fill="var(--ink)"/><g fill="var(--accent)"><circle cx="8" cy="8" r="2.6"/><circle cx="18" cy="8" r="2.6"/><circle cx="8" cy="18" r="2.6"/><circle cx="18" cy="18" r="2.6"/></g><path d="M8 8h10v10H8z" fill="none" stroke="var(--surface)" stroke-width="1.3" opacity=".55"/></svg>
        <span class="brand-name">VEX IQ 로봇 설계</span>
      </div>
      <div class="hd-right">
        <button class="tool" type="button" id="installBtn" hidden>앱 설치</button>
        <div class="peers" id="peers" aria-live="polite"></div>
        <span class="sync" id="sync" data-s="loading"><i></i><span>불러오는 중</span></span>
        <label class="switch" title="부품·옵션 설명 보이기">
          <input type="checkbox" id="explainToggle" checked>
          <span class="sw" aria-hidden="true"></span><span>설명</span>
        </label>
      </div>
    </div>
    <nav class="apptabs" aria-label="앱 탭">
      <button class="apptab on" type="button" aria-current="page">설계</button>
      <button class="apptab" type="button" disabled title="2차 버전에서 추가돼요">시뮬레이션<small>2차</small></button>
      <button class="apptab" type="button" disabled title="3차 버전에서 추가돼요">진단<small>3차</small></button>
      <button class="design-pick" id="designPick" type="button" title="구상안 바꾸기"><span id="designPickName">구상안</span><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
    </nav>
  </header>
  <div class="banner" id="banner" hidden></div>
  <main class="work" id="work">
    <section class="views" id="views" data-v="3d" aria-label="로봇 보기">
      <div class="vbar">
        <div class="seg" id="viewSeg" role="group" aria-label="보기 방식"></div>
        <div class="seg" id="sideSeg" role="group" aria-label="2D 방향" hidden>
          <button type="button" data-sv="top" class="on">위에서</button>
          <button type="button" data-sv="side">옆에서</button>
        </div>
        <span class="grow"></span>
        <button class="tool" type="button" id="startBoxBtn" title="시작 크기 11×20×15in 상자 보기">시작 크기</button>
        <button class="tool bigbtn" type="button" id="bigBtn" title="보기 영역 크게">크게</button>
      </div>
      <div class="stage">
        <div class="pane2d" id="pane2d" data-only="top">
          <div class="sv" data-sv="top"><span class="sv-cap" id="capTop">위에서 본 모습</span><svg id="svgTop" class="d2" role="img" aria-label="위에서 본 로봇 도면"></svg></div>
          <div class="sv" data-sv="side"><span class="sv-cap">옆(오른쪽)에서 본 모습</span><svg id="svgSide" class="d2" role="img" aria-label="옆에서 본 로봇 도면"></svg></div>

/* =========================================================
   로봇 모델: 설계 문서 → 부품 목록
   좌표(칸): x = 오른쪽+, y = 앞+, z = 위+, 바닥 z=0, 로봇 가운데 x=y=0
   드라이빙보드는 "사진 좌표"(u: A면 사진 왼→오, v: 끝1→끝2, zf: B면→A면)로
   만든 뒤 앞·위 선택에 맞춰 뒤집어 놓는다.
   ========================================================= */
const r2 = n => Math.round(n * 2) / 2;
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const clone = o => (o == null ? o : JSON.parse(JSON.stringify(o)));
const isObj = o => o && typeof o === 'object' && !Array.isArray(o);
function deepMerge(t, p) {
  for (const k of Object.keys(p)) {
    const v = p[k];
    if (isObj(v) && isObj(t[k])) deepMerge(t[k], v);
    else t[k] = clone(v);
  }
  return t;
}
const add3 = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];

function defaultDesign(name) {
  const now = Date.now();
  return {
    name: name || '구상안 1', deleted: false,
    frame: { w: 16, l: 20 },
    orient: { top: null, front: null },
    opts: { launch: null, dir: 'front', intake: null, brain: null, bands: 4, rail: 40, pull: 'winch' },
    mods: {}, edits: {}, added: {}, notes: '',
    createdAt: now, createdBy: null, updatedAt: now, updatedBy: null,
  };
}
function normDesign(d) {
  const def = defaultDesign();
  const o = Object.assign({}, def, d || {});
  o.frame = Object.assign({}, def.frame, (d && d.frame) || {});
  o.frame.w = clamp(Number(o.frame.w) || 16, 14, 24);
  o.frame.l = clamp(Number(o.frame.l) || 20, 19, 32);
  o.orient = Object.assign({}, def.orient, (d && d.orient) || {});
  o.opts = Object.assign({}, def.opts, (d && d.opts) || {});
  o.opts.bands = clamp(Math.round(Number(o.opts.bands) || 4), 1, 8);
  o.opts.rail = clamp(Math.round(Number(o.opts.rail) || 40), 15, 85);
  o.mods = Object.assign({}, (d && d.mods) || {});
  o.edits = Object.assign({}, (d && d.edits) || {});
  o.added = Object.assign({}, (d && d.added) || {});
  return o;
}

/* ---------- 방향 변환 ---------- */
function orientT(d) {
  const W = d.frame.w, L = d.frame.l;
  const top = (d.orient && d.orient.top) || 'A';
  const front = (d.orient && d.orient.front) || 'end1';
  const sx = ((top === 'A') === (front === 'end1')) ? 1 : -1;
  const sy = front === 'end1' ? -1 : 1;
  const zf = top === 'B';
  return {
    W, L, sx, sy, zf, top, front,
    decided: !!(d.orient && d.orient.top && d.orient.front),
    p: (u, v, z) => [sx * (u - W / 2), sy * (v - L / 2), zf ? 2 * AXLE_Z - z : z],
    inv: (dx, dy, dz) => [sx * dx, sy * dy, zf ? -dz : dz],
  };
}

/* ---------- 부품 만들기 도우미 ---------- */
function P_box(key, kind, c, s, o) { return Object.assign({ key, kind, shape: 'box', c, s, rx: 0, collide: true }, o || {}); }

  return P_box(key, kind, [(x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2], [x1 - x0, y1 - y0, z1 - z0], o);
}
function P_cyl(key, kind, c, axis, r, len, o) {
  const s = axis === 'x' ? [len, 2 * r, 2 * r] : axis === 'y' ? [2 * r, len, 2 * r] : [2 * r, 2 * r, len];
  return Object.assign({ key, kind, shape: 'cyl', c, axis, r, len, s, rx: 0, collide: true }, o || {});
}
function P_line(key, kind, a, b, w, o) {
  return Object.assign({ key, kind, shape: 'line', a, b, w: w || 0.07,
    c: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2], s: [0, 0, 0], rx: 0, collide: false }, o || {});
}
/* y-z 평면에서 p0→p1 방향으로 기울어진 상자 (x는 cx 중심) */
function P_pitch(key, kind, cx, p0, p1, w, thick, nOff, o) {
  const dy = p1[0] - p0[0], dz = p1[1] - p0[1];
  const len = Math.hypot(dy, dz);
  let ang = Math.atan2(dz, dy) * 180 / Math.PI;
  if (ang > 90) ang -= 180; if (ang <= -90) ang += 180;
  const t = ang * Math.PI / 180, n = [-Math.sin(t), Math.cos(t)];
  const c = [cx, (p0[0] + p1[0]) / 2 + n[0] * (nOff || 0), (p0[1] + p1[1]) / 2 + n[1] * (nOff || 0)];
  return P_box(key, kind, c, [w, len, thick], Object.assign({ rx: ang }, o || {}));
}
function aabb(p) {
  if (p.shape === 'line') {
    const r = p.w || 0.07;
    return { min: [0, 1, 2].map(i => Math.min(p.a[i], p.b[i]) - r), max: [0, 1, 2].map(i => Math.max(p.a[i], p.b[i]) + r) };
  }
  const t = (p.rx || 0) * Math.PI / 180, c = Math.abs(Math.cos(t)), s = Math.abs(Math.sin(t));
  const hx = p.s[0] / 2, hy = c * p.s[1] / 2 + s * p.s[2] / 2, hz = s * p.s[1] / 2 + c * p.s[2] / 2;
  return { min: [p.c[0] - hx, p.c[1] - hy, p.c[2] - hz], max: [p.c[0] + hx, p.c[1] + hy, p.c[2] + hz] };
}
const KMASS = { omni: 40, motor: 75, shaft: 3, collar: 1, cornerConn: 4, connBlock: 3, launchMotor: 75, intakeMotor: 75,
  liftMotor: 75, brain: 190, battery: 110, band: 1.5, string: 0.5, bag: 0, armStop: 0, cMotor: 75, cWheel: 40, cConn: 3 };
function massFor(p) {
  if (p.mass != null) return p.mass;
  if (KMASS[p.kind] != null) return KMASS[p.kind];
  if (p.ph) { const v = p.s[0] * p.s[1] * p.s[2]; return Math.round(v * 0.5); }
  const a = [...p.s].sort((x, y) => x - y);
  return Math.round(0.45 * a[1] * a[2] * 10) / 10;
}

/* ---------- 드라이빙보드 (사진으로 잡은 구도) ---------- */
function driveSpecs(W, L) {
  const S = [];
  const R = (key, kind, u0, u1, v0, v1, z0, z1, t) => S.push({ key, kind, shape: 'box', u0, u1, v0, v1, z0, z1, t: t || {} });
  const C = (key, kind, uc, vc, zc, r, len, t) => S.push({ key, kind, shape: 'cyl', uc, vc, zc, r, len, t: t || {} });
  R('wallL', 'wallOuter', 0, 0.5, 0.5, L - 0.5, 1.5, 3.5, { side: 'L', face: 'frame' });
  R('wallR', 'wallOuter', W - 0.5, W, 0.5, L - 0.5, 1.5, 3.5, { side: 'R', face: 'frame' });
  R('wallE1', 'wallEnd', 0, W, 0, 0.5, 1.5, 3.5, { end: '1', face: 'frame' });
  R('wallE2', 'wallEnd', 0, W, L - 0.5, L, 1.5, 3.5, { end: '2', face: 'frame' });
  R('innerL', 'wallInner', 3.0, 3.5, 0.5, L - 0.5, 1.5, 3.5, { side: 'L', face: 'frame' });
  R('innerR', 'wallInner', W - 3.5, W - 3.0, 0.5, L - 0.5, 1.5, 3.5, { side: 'R', face: 'frame' });
  for (const e of ['1', '2']) {
    const cv0 = e === '1' ? 0.5 : L - 1.75, cv1 = e === '1' ? 1.75 : L - 0.5;
    const wv = e === '1' ? 4.5 : L - 4.5;
    const mv0 = e === '1' ? 3.0 : L - 7.5, mv1 = e === '1' ? 7.5 : L - 3.0;
    for (const s of ['L', 'R']) {
      const t = { end: e, side: s, face: 'frame' }, id = e + s, Lf = s === 'L';
      R('cc_' + id, 'cornerConn', Lf ? 0.5 : W - 3.0, Lf ? 3.0 : W - 0.5, cv0, cv1, 1.5, 3.5, t);
      C('wheel_' + id, 'omni', Lf ? 1.75 : W - 1.75, wv, AXLE_Z, 2.5, 2.2, t);
      R('shaft_' + id, 'shaft', Lf ? -0.35 : W - 5.0, Lf ? 5.0 : W + 0.35, wv - 0.13, wv + 0.13, AXLE_Z - 0.13, AXLE_Z + 0.13, Object.assign({ nc: true }, t));
      C('collar_' + id, 'collar', Lf ? -0.175 : W + 0.175, wv, AXLE_Z, 0.45, 0.35, t);
      R('motor_' + id, 'motor', Lf ? 3.5 : W - 7.0, Lf ? 7.0 : W - 3.5, mv0, mv1, 1.5, 3.5, t);
    }
  }
  // A면: 가운데 세로 빔 + 흰 연결 블록 줄(끝1 쪽 1줄, 가운데 2줄)
  R('beamC', 'centerBeam', W / 2 - 1, W / 2 + 1, 1.75, L - 3.75, 3.0, 3.5, { face: 'A' });
  const mc = clamp(L / 2 + 0.5, 9.3, L - 9.3);
  const rows = [['T', 1.25, 3.0, '1'], ['M1', mc - 1.75, mc, null], ['M2', mc, mc + 1.75, null]];
  for (const [r, v0, v1, e] of rows) {
    R(`r${r}_cL`, 'connBlock', 3.5, 5.25, v0, v1, 2.0, 3.5, { face: 'A', side: 'L', end: e, row: r });
    R(`r${r}_pL`, 'crossPlate', 5.25, W / 2 - 1, v0, v1, 3.0, 3.5, { face: 'A', side: 'L', end: e, row: r });
    R(`r${r}_pR`, 'crossPlate', W / 2 + 1, W - 5.25, v0, v1, 3.0, 3.5, { face: 'A', side: 'R', end: e, row: r });
    R(`r${r}_cR`, 'connBlock', W - 5.25, W - 3.5, v0, v1, 2.0, 3.5, { face: 'A', side: 'R', end: e, row: r });
  }
  // B면: 넓은 판 2개(가운데), 작은 판 2개(끝1 쪽)
  R('wideB1', 'widePlate', 3.5, W - 3.5, mc - 1.75, mc, 1.5, 2.0, { face: 'B', row: 'M1' });
  R('wideB2', 'widePlate', 3.5, W - 3.5, mc, mc + 1.75, 1.5, 2.0, { face: 'B', row: 'M2' });
  R('smallBL', 'smallPlate', 3.5, W / 2, 1.0, 3.0, 1.5, 2.0, { face: 'B', side: 'L', end: '1' });
  R('smallBR', 'smallPlate', W / 2, W - 3.5, 1.0, 3.0, 1.5, 2.0, { face: 'B', side: 'R', end: '1' });
  return S;
}

function buildDrive(d, T, out, hidden) {
  for (const sp of driveSpecs(T.W, T.L)) {
    const ed = (d.edits && d.edits[sp.key]) || null;
    if (ed && ed.hidden) { hidden.push({ key: sp.key, kind: sp.kind, tags: sp.t, group: 'drive' }); continue; }
    const dx = (ed && ed.dx) || 0, dy = (ed && ed.dy) || 0, dz = (ed && ed.dz) || 0;
    const dw = (ed && ed.dw) || 0, dl = (ed && ed.dl) || 0, dh = (ed && ed.dh) || 0;
    let p;
    if (sp.shape === 'cyl') {
      p = P_cyl(sp.key, sp.kind, T.p(sp.uc + dx, sp.vc + dy, sp.zc + dz), 'x', Math.max(0.2, sp.r + dl / 2), Math.max(0.25, sp.len + dw));
    } else {
      p = P_box(sp.key, sp.kind,
        T.p((sp.u0 + sp.u1) / 2 + dx, (sp.v0 + sp.v1) / 2 + dy, (sp.z0 + sp.z1) / 2 + dz),
        [Math.max(0.25, sp.u1 - sp.u0 + dw), Math.max(0.25, sp.v1 - sp.v0 + dl), Math.max(0.25, sp.z1 - sp.z0 + dh)]);
    }
    p.group = 'drive'; p.mod = null; p.tags = sp.t; p.collide = !sp.t.nc;
    p.edited = !!(dx || dy || dz || dw || dl || dh);
    out.push(p);
  }
}

/* ---------- 발사부 ---------- */
function mirrorY(p) { p.c[1] = -p.c[1]; p.rx = -(p.rx || 0); if (p.a) { p.a[1] = -p.a[1]; p.b[1] = -p.b[1]; } }
function shiftPart(p, v) { p.c = add3(p.c, v); if (p.a) { p.a = add3(p.a, v); p.b = add3(p.b, v); } }
function finishMod(P, d, mod, mirror) {
  for (const p of P) { p.mod = mod; p.group = mod; }
  if (mirror) P.forEach(mirrorY);
  const m = d.mods && d.mods[mod];
  if (m && (m.dx || m.dy || m.dz)) P.forEach(p => shiftPart(p, [m.dx || 0, m.dy || 0, m.dz || 0]));
  return P;
}
function bagPart(key, c, rx) { return P_box(key, 'bag', c, [3.8, 3.8, 1.6], { rx: rx || 0, bag: true, collide: false, mass: 0 }); }

function buildLauncher(d, T) {
  const o = d.opts, hw = T.W / 2, iw = hw - 3.5, z0 = ZTOP, P = [];

  if (!o.launch) {

    return finishMod(P, d, 'launcher', o.dir === 'back');
  }
  const N = clamp(o.bands | 0, 1, 8);
  const awayFromPosts = (cy, half, yT) => (cy + half > yT - 0.6 && cy - half < yT + 0.6) ? yT - 0.6 - half : cy;
  if (SLING(o.launch)) {
    const down = o.launch === 'sling_down';
    const thd = clamp(o.rail, 15, 85), th = thd * Math.PI / 180;
    const Lr = down ? 9.5 : 11, yT = down ? 1.5 : 3.0, zB = z0 + 1.2;
    const u = [Math.cos(th), Math.sin(th)], n = [-Math.sin(th), Math.cos(th)];
    const B = [yT - Lr * u[0], zB], Tp = [yT, zB + Lr * u[1]];
    add(P_rng('L:base', 'basePlate', -4, 4, Math.min(-7, B[0] - 1), 5, z0, z0 + 0.5, { mass: 30 }));
    add(P_pitch('L:rail', 'rail', 0, B, Tp, 2.4, 0.4, 0, { mass: 20 }));
    add(P_rng('L:railsup', 'railSup', -1.2, 1.2, B[0] - 0.5, B[0] + 0.5, z0 + 0.5, zB - 0.3, { mass: 4 }));
    const postTop = Tp[1] + 1.2;

    add(bagPart('L:bag', [0, Pc[0] + n[0] * 1.2, Pc[1] + n[1] * 1.2], thd));
    const bk = [Pc[0] - u[0] * 1.3 + n[0] * 0.2, Pc[1] - u[1] * 1.3 + n[1] * 0.2];
    for (let i = 0; i < N; i++) {
      const sd = i % 2 === 0 ? -1 : 1, k = Math.floor(i / 2);
      add(P_line('L:band' + i, 'band', [sd * 2.75, yT, postTop - 0.4 - k * 0.3], [sd * 1.8, bk[0], bk[1] - k * 0.1], 0.07));
    }
    const mzc = z0 + 0.5, mzt = z0 + 4.0;
    if (o.pull === 'winch' || !o.pull) {
      const cy = awayFromPosts(B[0] + 1.5, 2.25, yT);

      add(P_cyl('L:winch', 'winch', [1.6, cy, z0 + 1.6], 'x', 0.8, 1.6, { mass: 6 }));
      add(P_line('L:string', 'string', [1.0, cy, z0 + 2.4], [0, bk[0], bk[1]], 0.04));
      add(P_box('L:latch', 'latch', [0, Pc[0] - u[0] * 1.9 - n[0] * 0.55, Pc[1] - u[1] * 1.9 - n[1] * 0.55], [1.2, 0.8, 0.8], { rx: thd, mass: 4 }));
    } else if (o.pull === 'rack') {
      const mid = [(B[0] + Tp[0]) / 2, (B[1] + Tp[1]) / 2];
      add(P_box('L:rack', 'rack', [0, mid[0] - n[0] * 0.55, mid[1] - n[1] * 0.55], [0.5, Lr - 2, 0.5], { rx: thd, mass: 12 }));
      add(P_cyl('L:pinion', 'pinion', [0.9, mid[0] - n[0] * 1.25, mid[1] - n[1] * 1.25], 'x', 0.9, 0.5, { mass: 4 }));

      add(P_box('L:latch', 'latch', [0, Pc[0] - u[0] * 1.9 - n[0] * 0.55, Pc[1] - u[1] * 1.9 - n[1] * 0.55], [1.2, 0.8, 0.8], { rx: thd, mass: 4 }));
    } else {
      const gz = Math.max(z0 + 2.1, Pc[1] - 1.6);
      add(P_cyl('L:slip', 'slipGear', [2.3, Pc[0], gz], 'x', 1.5, 0.5, { mass: 8 }));
      const cy = awayFromPosts(Pc[0], 2.25, yT);
      add(P_rng('L:motor', 'launchMotor', 2.6, 4.6, cy - 2.25, cy + 2.25, mzc, mzt));
    }
  } else if (o.launch === 'catapult') {
    add(P_rng('L:base', 'basePlate', -4, 4, -7, 5, z0, z0 + 0.5, { mass: 30 }));

    add(P_rng('L:towerR', 'pivotTower', 2.4, 3.1, Py - 0.5, Py + 0.5, z0 + 0.5, Pz + 0.6, { mass: 6 }));
    add(P_cyl('L:pivot', 'pivot', [0, Py, Pz], 'x', 0.22, 6.6, { collide: false, mass: 4 }));
    const bc = -12 * Math.PI / 180, a = [-Math.cos(bc), Math.sin(bc)];

    const bs = (90 - clamp(o.rail, 15, 85)) * Math.PI / 180;

    const Sp = [Py + as[0] * 6 + tv[0] * 0.75, Pz + as[1] * 6 + tv[1] * 0.75];
    add(P_rng('L:stop', 'stopper', -3.0, 3.0, Sp[0] - 0.4, Sp[0] + 0.4, Sp[1] - 0.4, Sp[1] + 0.4, { mass: 8 }));
    add(P_rng('L:stopL', 'stopPost', -3.0, -2.55, Sp[0] - 0.3, Sp[0] + 0.3, z0 + 0.5, Sp[1] - 0.4, { mass: 4 }));
    add(P_rng('L:stopR', 'stopPost', 2.55, 3.0, Sp[0] - 0.3, Sp[0] + 0.3, z0 + 0.5, Sp[1] - 0.4, { mass: 4 }));
    add(P_pitch('L:armStop', 'armStop', 0, A0, [Py + as[0] * La, Pz + as[1] * La], 1.0, 0.6, 0, { ghost: true, collide: false, mass: 0 }));
    add(P_rng('L:anchor', 'bandAnchor', -2.2, 2.2, 4.4, 5.0, z0 + 0.5, z0 + 1.6, { mass: 6 }));
    const Ab = [Py + a[0] * 2.8, Pz + a[1] * 2.8];
    for (let i = 0; i < N; i++) {
      const sd = i % 2 === 0 ? -1 : 1, k = Math.floor(i / 2);
      add(P_line('L:band' + i, 'band', [sd * (0.35 + k * 0.12), Ab[0], Ab[1] - 0.3], [sd * (1.2 + k * 0.25), 4.7, z0 + 1.4], 0.07));
    }
    add(P_rng('L:motor', 'launchMotor', 2.5, 4.5, -3.0, 1.5, z0 + 0.5, z0 + 4.0));

  } else { // lift
    add(P_rng('L:towerL', 'liftTower', -3.4, -2.6, 4.0, 5.0, z0, z0 + 13, { mass: 15 }));
    add(P_rng('L:towerR', 'liftTower', 2.6, 3.4, 4.0, 5.0, z0, z0 + 13, { mass: 15 }));
    add(P_rng('L:carriage', 'carriage', -2.6, 2.6, 5.0, 5.8, z0 + 2.0, z0 + 6.0, { mass: 10 }));
    add(P_rng('L:tray', 'tray', -2.2, 2.2, 5.8, 9.4, z0 + 2.0, z0 + 2.6, { mass: 8 }));

/* ---------- 인테이커 (항상 앞쪽) ---------- */

/* ---------- 직접 추가한 부품 ---------- */
function buildCustom(d) {
  const out = [];
  for (const id of Object.keys(d.added || {})) {
    const a = d.added[id];
    if (!a || !a.c || !a.s) continue;
    const def = ADDABLE.find(x => x.kind === a.kind) || ADDABLE[ADDABLE.length - 1];
    let p;
    if (def.cyl) p = P_cyl('C:' + id, a.kind, a.c.slice(), 'x', Math.max(0.2, a.s[1] / 2), Math.max(0.25, a.s[0]));
    else p = P_box('C:' + id, a.kind, a.c.slice(), a.s.map(v => Math.max(0.25, v)));
    p.group = 'custom'; p.mod = null; p.cid = id; p.name = a.name || KIND[a.kind].name;
    p.ph = a.kind === 'cBox';
    if (def.mass) p.mass = def.mass;
    out.push(p);
  }

}

/* ---------- 조립 ---------- */
function unitOfPart(p) {
  if (!p) return null;
  if (p.mod) return { type: 'mod', mod: p.mod, id: 'mod:' + p.mod };
  if (p.group === 'custom') return { type: 'custom', cid: p.cid, id: 'c:' + p.cid };
  return { type: 'drive', key: p.key, id: 'd:' + p.key };
}
function partInUnit(p, u) {
  if (!u) return false;

  return p.key === u.key;

function buildRobot(design, drag) {
  const d = normDesign(design);

  buildDrive(d, T, parts, hidden);
  parts.push(...buildLauncher(d, T), ...buildIntake(d, T), ...buildBrain(d, T), ...buildCustom(d));
  if (drag && drag.unit && (drag.delta[0] || drag.delta[1] || drag.delta[2])) {

}

/* ---------- 이름 ---------- */
function faceWord(face, T) {
  if (face !== 'A' && face !== 'B') return '';
  if (T.decided) return face === T.top ? '윗면' : '밑면';
  return face + '면';
}
function partName(p, T) {
  if (!p) return '';
  if (p.group === 'custom') return p.name || KIND[p.kind].name;
  const base = (KIND[p.kind] && KIND[p.kind].name) || p.kind;
  if (p.group !== 'drive') {
    if (['slingFrame', 'pivotTower', 'liftTower', 'intakeArm', 'finger', 'guide', 'stopPost', 'leg'].includes(p.kind))
      return base + (p.c[0] < 0 ? ' (왼쪽)' : ' (오른쪽)');
    return base;
  }
  const t = p.tags || {}, bits = [];
  if (t.row === 'M1' || t.row === 'M2') {
    if (T.decided) bits.push(p.c[1] >= 0 ? '가운데 앞줄' : '가운데 뒷줄');
    else bits.push('가운데 ' + (t.row === 'M1' ? '1' : '2') + '줄');
  } else if (t.end) {
    if (T.decided) bits.push(p.c[1] > 0 ? '앞' : '뒤');
    else bits.push('끝' + t.end);
  }
  if (t.side) {
    if (T.decided) bits.push(p.c[0] < 0 ? '왼쪽' : '오른쪽');
    else bits.push(t.side === 'L' ? '왼쪽' : '오른쪽');
  }
  const f = faceWord(t.face, T);
  if (f && p.kind !== 'centerBeam') bits.unshift(f);
  if (p.kind === 'centerBeam' && f) bits.push(f);
  return bits.length ? `${base} (${bits.join(' · ')})` : base;
}
function unitName(u, robot) {
  if (!u) return '';
  if (u.type === 'mod') return MODS[u.mod].label;
  if (u.type === 'custom') { const p = robot.parts.find(q => q.cid === u.cid); return p ? p.name : '추가한 부품'; }
  const p = robot.byKey.get(u.key);
  if (p) return partName(p, robot.T);
  const h = robot.hidden.find(x => x.key === u.key);
  return h ? partName(Object.assign({ c: [0, 0, 0], group: 'drive' }, h), robot.T) : u.key;
}

/* ---------- 말로 된 방향 ---------- */
const fmtN = n => { const v = Math.round(n * 10) / 10; return Number.isInteger(v) ? String(v) : v.toFixed(1); };
function vecWords(v) {
  const w = [];
  if (v[1]) w.push((v[1] > 0 ? '앞 ' : '뒤 ') + fmtN(Math.abs(v[1])) + '칸');
  if (v[0]) w.push((v[0] > 0 ? '오른쪽 ' : '왼쪽 ') + fmtN(Math.abs(v[0])) + '칸');
  if (v[2]) w.push((v[2] > 0 ? '위 ' : '아래 ') + fmtN(Math.abs(v[2])) + '칸');
  return w.join(' · ') || '제자리';
}
const inch = k => fmtN(k * IN_PER);
const mm = k => Math.round(k * MM_PER);

/* =========================================================
   자동 검사: 겹침 · 무게중심 · 시작 크기 · 옵션 조합 · 바닥
   ========================================================= */
function rectYZ(p, eps) {
  const t = (p.rx || 0) * Math.PI / 180;
  return { u: [Math.cos(t), Math.sin(t)], v: [-Math.sin(t), Math.cos(t)],
    hy: Math.max(0, p.s[1] / 2 - eps), hz: Math.max(0, p.s[2] / 2 - eps) };
}
/* 모든 회전이 x축 기준이라 x 구간 + y-z 평면 사각형 겹침으로 충분하다 */
function obbOverlap(a, b, eps) {
  eps = eps == null ? 0.03 : eps;
  if (Math.abs(a.c[0] - b.c[0]) >= (a.s[0] / 2 - eps) + (b.s[0] / 2 - eps)) return false;
  const ra = rectYZ(a, eps), rb = rectYZ(b, eps);
  const dy = b.c[1] - a.c[1], dz = b.c[2] - a.c[2];
  for (const ax of [ra.u, ra.v, rb.u, rb.v]) {
    const d = Math.abs(dy * ax[0] + dz * ax[1]);
    const pa = ra.hy * Math.abs(ra.u[0] * ax[0] + ra.u[1] * ax[1]) + ra.hz * Math.abs(ra.v[0] * ax[0] + ra.v[1] * ax[1]);
    const pb = rb.hy * Math.abs(rb.u[0] * ax[0] + rb.u[1] * ax[1]) + rb.hz * Math.abs(rb.v[0] * ax[0] + rb.v[1] * ax[1]);
    if (d >= pa + pb) return false;
  }
  return true;
}
function bbOverlap(a, b) {
  for (let i = 0; i < 3; i++) if (a.max[i] <= b.min[i] || b.max[i] <= a.min[i]) return false;
  return true;
}

function analyze(robot) {
  const d = robot.design, o = d.opts, T = robot.T;
  const solid = robot.parts.filter(p => !p.ghost && !p.bag);
  const W = [];
  const bb = { min: [Infinity, Infinity, Infinity], max: [-Infinity, -Infinity, -Infinity] };
  for (const p of solid) for (let i = 0; i < 3; i++) { bb.min[i] = Math.min(bb.min[i], p.bb.min[i]); bb.max[i] = Math.max(bb.max[i], p.bb.max[i]); }
  const dims = { w: bb.max[0] - bb.min[0], l: bb.max[1] - bb.min[1], h: bb.max[2] - Math.min(0, bb.min[2]) };
  const short = Math.min(dims.w, dims.l), long = Math.max(dims.w, dims.l);

  // 무게·무게중심
  let M = 0; const s = [0, 0, 0];
  for (const p of solid) { const m = p.mass || 0; M += m; for (let i = 0; i < 3; i++) s[i] += m * p.c[i]; }
  const com = M > 0 ? s.map(v => v / M) : [0, 0, 0];

  // 바퀴 접지
  const wheels = solid.filter(p => p.kind === 'omni' || p.kind === 'cWheel');
  const bottoms = wheels.map(p => p.c[2] - (p.r || p.s[2] / 2));
  const lowB = bottoms.length ? Math.min(...bottoms) : 0;
  const touching = wheels.filter((p, i) => bottoms[i] <= lowB + 0.25);
  let sup = null, ratio = null;
  if (touching.length >= 3) {
    const xs = touching.map(p => p.c[0]), ys = touching.map(p => p.c[1]);
    sup = { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) };
    const hx = (sup.x1 - sup.x0) / 2, hy = (sup.y1 - sup.y0) / 2;
    const cx = (sup.x0 + sup.x1) / 2, cy = (sup.y0 + sup.y1) / 2;
    const dx = com[0] - cx, dy = com[1] - cy;
    ratio = { x: hx > 0 ? dx / hx : 0, y: hy > 0 ? dy / hy : 0, dx, dy, hx, hy };
    const minArm = Math.min(hx - Math.abs(dx), hy - Math.abs(dy));
    const zc = Math.max(0.5, com[2] - lowB);
    ratio.tip = minArm > 0 ? Math.atan2(minArm, zc) * 180 / Math.PI : 0;
  }

  // 겹침
  const col = solid.filter(p => p.collide !== false && p.shape !== 'line');
  const groups = new Map(), bad = new Set();
  for (let i = 0; i < col.length; i++) for (let j = i + 1; j < col.length; j++) {
    const a = col[i], b = col[j];
    if (a.mod && a.mod === b.mod) continue;
    if (!bbOverlap(a.bb, b.bb) || !obbOverlap(a, b)) continue;
    const la = a.mod ? MODS[a.mod].label : partName(a, T), lb = b.mod ? MODS[b.mod].label : partName(b, T);
    const key = [la, lb].sort().join('|');
    if (!groups.has(key)) groups.set(key, { la, lb, parts: [], keys: new Set(), ph: true });
    const g = groups.get(key);
    if (!a.ph && !b.ph) g.ph = false;
    g.parts.push([partName(a, T), partName(b, T)]);
    g.keys.add(a.key); g.keys.add(b.key); if (!a.ph && !b.ph) { bad.add(a.key); bad.add(b.key); }
  }
  for (const g of groups.values()) {
    const ex = g.parts.slice(0, 3).map(([x, y]) => (x === g.la && y === g.lb) ? null : `${x} ↔ ${y}`).filter(Boolean);
    if (g.ph) W.push({ id: 'ov:' + g.la + g.lb, level: 'warn', title: `자리 겹침: ${g.la} ↔ ${g.lb}`,
      detail: '아직 정하지 않은 부품의 임시 상자와 겹쳐요. 그 부품을 고르면 실제로 겹치는지 다시 확인할 수 있어요.', keys: [...g.keys] });
    else W.push({ id: 'ov:' + g.la + g.lb, level: 'danger', title: `겹침: ${g.la} ↔ ${g.lb}`,
      detail: (ex.length ? ex.join(', ') + '. ' : '') + '같은 자리에 두 부품이 있을 수 없어요. 한쪽을 칸 단위로 옮기거나 옵션을 바꿔 보세요.',
      keys: [...g.keys] });
  }

  // 시작 크기
  const over = [];
  if (short > LIM.w + 1e-6) over.push(`폭 ${inch(short)}in (11in까지)`);
  if (long > LIM.l + 1e-6) over.push(`길이 ${inch(long)}in (20in까지)`);
  if (dims.h > LIM.h + 1e-6) over.push(`높이 ${inch(dims.h)}in (15in까지)`);
  if (over.length) W.push({ id: 'size', level: 'danger', title: '시작 크기 초과: ' + over.join(', '),
    detail: '경기 시작 때 폭 11 × 길이 20 × 높이 15in 상자 안에 들어가야 해요. 접어 두었다가 시작 후 펼치는 구조(길이 24in까지, 높이는 제한 없음)를 생각해 보세요.', tool: 'startBox' });

  // 무게중심
  if (ratio) {
    const rx = Math.abs(ratio.x), ry = Math.abs(ratio.y);
    if (rx >= 1 || ry >= 1) {
      W.push({ id: 'comOut', level: 'danger', title: '무게중심이 바퀴 밖으로 나갔어요',
        detail: '이대로면 로봇이 넘어져요. 무거운 부품(브레인·배터리·모터)을 바퀴 안쪽으로 옮겨 주세요.', com: true });
    } else {
      if (rx >= 0.4) W.push({ id: 'comX', level: rx >= 0.7 ? 'danger' : 'warn',
        title: `무게중심이 ${ratio.x > 0 ? '오른쪽' : '왼쪽'}으로 쏠렸어요 (바퀴 폭의 ${Math.round(rx * 100)}%)`,
        detail: '돌 때 한쪽으로 끌리고, 옆에서 부딪히면 넘어지기 쉬워요. 무거운 부품을 반대쪽이나 가운데로 옮겨 보세요.', com: true });
      if (ry >= 0.45) W.push({ id: 'comY', level: ry >= 0.75 ? 'danger' : 'warn',
        title: `무게중심이 ${ratio.y > 0 ? '앞' : '뒤'}쪽으로 쏠렸어요 (바퀴 사이 거리의 ${Math.round(ry * 100)}%)`,
        detail: ratio.y > 0 ? '급하게 멈추거나 빈백을 들 때 앞으로 넘어질 수 있어요. 무거운 부품을 뒤쪽으로 옮겨 보세요.'
          : '급하게 출발할 때 앞바퀴가 뜨거나 뒤로 넘어질 수 있어요. 무거운 부품을 앞쪽으로 옮겨 보세요.', com: true });
      if (ratio.tip < 30) W.push({ id: 'comZ', level: 'warn', title: '무게중심이 높아요',
        detail: `무게중심 높이 ${inch(com[2])}in. 급정지나 충돌 때 넘어지기 쉬워요. 무거운 부품을 낮게 달아 보세요.`, com: true });
    }
  }

  // 바닥
  const under = solid.filter(p => p.bb.min[2] < -0.05);
  if (under.length) W.push({ id: 'under', level: 'danger', title: '바닥 아래로 내려간 부품이 있어요',
    detail: under.slice(0, 4).map(p => partName(p, T)).join(', ') + '. 위로 올려 주세요.', keys: under.map(p => p.key) });
  const drag = solid.filter(p => p.bb.min[2] >= -0.05 && p.bb.min[2] < lowB + 0.15 && !(p.kind === 'omni' || p.kind === 'cWheel'));
  if (drag.length) W.push({ id: 'drag', level: 'warn', title: '바닥에 끌릴 수 있는 부품이 있어요',
    detail: drag.slice(0, 4).map(p => partName(p, T)).join(', ') + '. 바퀴보다 조금 높게 올려 주세요.', keys: drag.map(p => p.key) });
  const air = wheels.filter((p, i) => bottoms[i] > lowB + 0.25);
  if (air.length) W.push({ id: 'air', level: 'warn', title: `바닥에 안 닿는 바퀴가 ${air.length}개 있어요`,
    detail: air.map(p => partName(p, T)).join(', ') + '. 바퀴 높이를 다른 바퀴와 맞춰 주세요.', keys: air.map(p => p.key) });

  // 모터 개수: 대회 규칙 R9 (스마트 모터 6개까지)
  const motors = solid.filter(p => ['motor', 'launchMotor', 'liftMotor', 'intakeMotor', 'cMotor'].includes(p.kind));
  if (motors.length > 6) W.push({ id: 'motors', level: 'danger', title: `모터가 ${motors.length}개예요 (규칙상 6개까지)`,
    detail: '대회 규칙(R9)상 스마트 모터는 6개까지 달 수 있어요. 연결하지 않은 모터도 세요. 바퀴 모터를 2개로 줄이거나(체인·기어로 앞뒤 바퀴 묶기) 장치를 합쳐 보세요.',
    keys: motors.map(p => p.key) });
  if (SLING(o.launch) && o.pull !== 'slip' && motors.length >= 6) W.push({ id: 'latchFree', level: 'warn', title: '걸쇠를 풀 모터가 없어요',
    detail: `모터 ${motors.length}개를 다 써서 걸쇠를 따로 풀 모터가 없어요. 같은 발사부 모터로 풀리는 장치를 만들거나, 공압 피스톤(VEX IQ 공압 키트)을 쓰거나, 걸쇠가 필요 없는 캠(크랭크) 방식으로 바꿔 보세요.`, combo: true });

  // 옵션 조합
