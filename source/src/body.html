<div id="app" class="app">
  <header class="hd">
    <div class="hd-row">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="5" fill="var(--ink)"/><g fill="var(--accent)"><circle cx="8" cy="8" r="2.6"/><circle cx="18" cy="8" r="2.6"/><circle cx="8" cy="18" r="2.6"/><circle cx="18" cy="18" r="2.6"/></g><path d="M8 8h10v10H8z" fill="none" stroke="var(--surface)" stroke-width="1.3" opacity=".55"/></svg>
        <span class="brand-name">VEX IQ 로봇 설계</span>
      </div>
      <div class="hd-right">
        <button class="tool" type="button" id="installBtn" hidden>앱 설치</button>
        <div class="peers" id="peers" aria-live="polite"></div>
        <span class="sync" id="sync" data-s="loading"><i></i><span>불러오는 중</span></span>
        <label class="switch" title="부품·옵션 설명 보이기">
          <input type="checkbox" id="explainToggle" checked>
          <span class="sw" aria-hidden="true"></span><span>설명</span>
        </label>
      </div>
    </div>
    <nav class="apptabs" aria-label="앱 탭">
      <button class="apptab on" type="button" aria-current="page">설계</button>
      <button class="apptab" type="button" disabled title="2차 버전에서 추가돼요">시뮬레이션<small>2차</small></button>
      <button class="apptab" type="button" disabled title="3차 버전에서 추가돼요">진단<small>3차</small></button>
      <button class="design-pick" id="designPick" type="button" title="구상안 바꾸기"><span id="designPickName">구상안</span><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
    </nav>
  </header>
  <div class="banner" id="banner" hidden></div>
  <main class="work" id="work">
    <section class="views" id="views" data-v="3d" aria-label="로봇 보기">
      <div class="vbar">
        <div class="seg" id="viewSeg" role="group" aria-label="보기 방식"></div>
        <div class="seg" id="sideSeg" role="group" aria-label="2D 방향" hidden>
          <button type="button" data-sv="top" class="on">위에서</button>
          <button type="button" data-sv="side">옆에서</button>
        </div>
        <span class="grow"></span>
        <button class="tool" type="button" id="startBoxBtn" title="시작 크기 11×20×15in 상자 보기">시작 크기</button>
        <button class="tool bigbtn" type="button" id="bigBtn" title="보기 영역 크게">크게</button>
      </div>
      <div class="stage">
        <div class="pane2d" id="pane2d" data-only="top">
          <div class="sv" data-sv="top"><span class="sv-cap" id="capTop">위에서 본 모습</span><svg id="svgTop" class="d2" role="img" aria-label="위에서 본 로봇 도면"></svg></div>
          <div class="sv" data-sv="side"><span class="sv-cap">옆(오른쪽)에서 본 모습</span><svg id="svgSide" class="d2" role="img" aria-label="옆에서 본 로봇 도면"></svg></div>
        </div>
        <div class="pane3d" id="pane3d">
          <canvas id="cv" aria-label="3D 로봇 모델"></canvas>
          <div class="labels" id="labels"></div>
          <div class="cam" id="camBtns">
            <button type="button" data-cam="iso">비스듬히</button>
            <button type="button" data-cam="front">앞</button>
            <button type="button" data-cam="side">옆</button>
            <button type="button" data-cam="top">위</button>
            <button type="button" data-cam="bottom">밑</button>
          </div>
        </div>
      </div>
      <div class="pick" id="pick" hidden></div>
    </section>
    <aside class="panel" id="panel" aria-label="설계 패널">
      <div class="ptabs" role="tablist" id="ptabs">
        <button class="ptab on" role="tab" type="button" data-tab="combo">조합</button>
        <button class="ptab" role="tab" type="button" data-tab="build">만들기</button>
        <button class="ptab" role="tab" type="button" data-tab="parts">부품</button>
        <button class="ptab" role="tab" type="button" data-tab="warn">경고</button>
        <button class="ptab" role="tab" type="button" data-tab="designs">구상안</button>
        <button class="ptab" role="tab" type="button" data-tab="hist">기록</button>
      </div>
      <div class="pbody" id="pbody"></div>
    </aside>
  </main>
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-hd"><h3 id="sheetTitle">구상안 나란히 비교</h3><span class="grow" style="flex:1"></span><button class="x" type="button" id="sheetClose" aria-label="닫기">×</button></div>
      <div class="sheet-bd" id="sheetBody"></div>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</div>
